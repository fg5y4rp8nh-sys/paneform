<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quorra — Sales CRM</title>
<meta name="description" content="A sales CRM template with a drag-and-drop deal board, contacts, tasks, reports and a light and dark theme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 6.4 15.4l2.6 2.6" /><circle cx="12" cy="12" r="4.2"/></svg></span>
      <div><b>Quorra</b><span>Lumen Analytics</span></div>
    </div>
    <nav class="nav" id="nav">
      <p class="nav-h">Workspace</p>
      <a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>Overview</a>
      <a href="#/deals" data-page="deals"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Deals<em id="navDeals">22</em></a>
      <a href="#/contacts" data-page="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></svg>Contacts</a>
      <a href="#/tasks" data-page="tasks"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>Tasks<em class="hot" id="navTasks">4</em></a>
      <a href="#/reports" data-page="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Reports</a>
      <p class="nav-h">Account</p>
      <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
    </nav>
    <div class="side-card">
      <p><b>November target</b><span id="sideTarget">$68,400 of $180,000</span></p>
      <div class="meter"><i id="sideMeter"></i></div>
    </div>
    <button class="me" type="button"><span class="av" style="--h:228">MC</span><span><b>Maya Chen</b><small>Sales lead</small></span><svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg></button>
  </aside>

  <div class="shell">
    <header class="bar">
      <button class="icon-btn only-m" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="search" id="searchBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><span>Search deals, people, companies</span><kbd>⌘K</kbd></button>
      <div class="bar-r">
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        <button class="icon-btn" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/></svg><i class="pip"></i></button>
        <button class="btn primary" id="newDealBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New deal</span></button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>

  <nav class="tabbar" id="tabbar">
    <a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>Home</a>
    <a href="#/deals" data-page="deals"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Deals</a>
    <a href="#/contacts" data-page="contacts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/></svg>People</a>
    <a href="#/tasks" data-page="tasks"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 14l2.5 2.5L16 12"/></svg>Tasks</a>
    <a href="#/reports" data-page="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>Reports</a>
  </nav>
</div>

<!-- Deal drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- Modal (new deal) -->
<div class="modal" id="modal" aria-hidden="true"><div class="modal-box" id="modalBox"></div></div>

<!-- Command palette -->
<div class="cmd" id="cmd" aria-hidden="true">
  <div class="cmd-box">
    <div class="cmd-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="cmdInput" placeholder="Search deals, people, companies…" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
