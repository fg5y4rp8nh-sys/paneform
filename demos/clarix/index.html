*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01","cv11"}
body.lock{overflow:hidden}
body.dragging{cursor:grabbing;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
em{font-style:normal}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
.i{flex:none;display:block}
.num{font-feature-settings:"tnum","ss01";letter-spacing:-.01em}
.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(255,90,31,.35)}
.btn-acc:hover{background:var(--acc-t)}
.btn-ink{background:var(--ink);color:var(--panel)}
.btn-ink:hover{opacity:.88}
.btn-line{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh)}
.btn-line:hover:not(:disabled){background:var(--hover)}

.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl-c th:first-child,.tbl-c td:first-child{padding-left:0}.tbl-c th:last-child,.tbl-c td:last-child{padding-right:0}
.card:not(.flush) .tbl-c th{background:transparent}
.tbl .ck{width:44px;padding-right:0}
.sortable{cursor:pointer;user-select:none}
.sortable .i{display:inline-block;vertical-align:-2px;margin-left:4px;opacity:.5}
.sortable.on{color:var(--ink)}.sortable.on .i{opacity:1}
.nores td{padding:44px 20px;text-align:center;white-space:normal}
.nores b{display:block;font-weight:500}.nores span{color:var(--mut);font-size:13px}
.sig{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt)}
.sig i{width:7px;height:7px;border-radius:50%}.sig.high i{background:var(--bad)}.sig.med i{background:var(--warn)}.sig.low i{background:var(--mut2)}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mut);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--hover);color:var(--ink)}
.tabs em{font-style:normal;font-family:var(--fm);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--line2);color:var(--mut)}
.tabs.ul{gap:22px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs.ul button{height:40px;padding:0;border-radius:0;background:none;box-shadow:inset 0 -2px 0 transparent}
.tabs.ul button.on{box-shadow:inset 0 -2px 0 var(--ink);background:none}
.fsearch{display:flex;align-items:center;gap:8px;width:280px;max-width:100%;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut)}
.fsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;color:var(--ink)}
.fsearch:focus-within{border-color:var(--mut2)}
.bulk{display:flex;align-items:center;gap:8px;height:0;padding:0 20px;overflow:hidden;background:var(--acc-s);font-size:13px;transition:height .25s var(--ease),padding .25s}
.bulk.on{height:50px;border-bottom:1px solid var(--line)}
.bulk>span{margin-right:6px}
.bulk .lnk{margin-left:auto}
.pgn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.pgn b{color:var(--ink);font-weight:500}
.pgb{display:flex;align-items:center;gap:4px}
.pn{width:30px;height:30px;border-radius:8px;font-family:var(--fm);font-size:12.5px;color:var(--mut)}
.pn.on{background:var(--ink);color:var(--panel)}
.pb{display:inline-flex;align-items:center;gap:10px}.pb .bar-t{width:70px}.pb em{font-style:normal;width:34px;text-align:right}

/* ---------- pipeline ---------- */
.chips{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chp{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--txt);transition:all .15s}
.chp em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut)}
.chp:hover{border-color:var(--mut2)}
.chp.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}.chp.on em{color:var(--mut2)}
.chips-r{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(5,minmax(214px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start;scrollbar-width:thin}
.col{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px;background:var(--line2);border:1px solid transparent;min-height:240px;transition:background .2s,border-color .2s}
html.dark .col{background:#111114}
.col.over{border-color:var(--acc);background:var(--acc-s)}
.col header{display:flex;align-items:center;gap:8px;padding:6px 6px 4px;font-size:13px}
.cdot{width:8px;height:8px;border-radius:50%}
.col header b{font-weight:600}
.cnt{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut);padding:1px 6px;border-radius:5px;background:var(--panel)}
.csum{margin-left:auto;font-size:12px;color:var(--mut)}
.col-l{display:flex;flex-direction:column;gap:8px;min-height:40px}
.dc{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:11px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);cursor:grab;transition:box-shadow .2s,border-color .2s,transform .2s;touch-action:pan-y}
.dc:hover{border-color:var(--mut2);box-shadow:0 6px 18px -8px rgba(0,0,0,.18)}
.dc.new{animation:pop 1.4s var(--ease)}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--acc)}30%{box-shadow:0 0 0 4px var(--acc-s),0 0 0 1px var(--acc)}100%{box-shadow:var(--sh)}}
.dc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.dc-h>span:not(.lg){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-h .ib{margin:-4px -4px -4px 0}
.dc-n{font-size:14px;font-weight:500;letter-spacing:-.01em;line-height:1.3}
.dc-v{display:flex;align-items:center;justify-content:space-between}
.dc-v span{font-size:15px;font-weight:500}
.dc-v em{font-style:normal;font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.dc-p{height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.dc-p i{display:block;height:100%;width:var(--w);border-radius:2px}
.dc-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tags{display:flex;gap:4px;min-width:0;overflow:hidden}
.tg{height:20px;padding:0 7px;border-radius:5px;background:var(--hover);font-size:11px;font-weight:500;color:var(--txt);display:inline-flex;align-items:center;white-space:nowrap}
.dc-m{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--mut);flex:none}
.dc-m>span{display:flex;align-items:center;gap:4px;font-feature-settings:"tnum"}
.add{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mut);border:1px dashed var(--mut2);transition:all .15s}
.add:hover{color:var(--ink);border-color:var(--mut);background:var(--panel)}
.ph{border-radius:11px;border:1.5px dashed var(--acc);background:var(--acc-s)}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:0 22px 50px -12px rgba(0,0,0,.35);border-color:var(--acc);cursor:grabbing}

/* ---------- reports ---------- */
.kpis.sm .kpi{position:relative;display:flex;flex-direction:column;padding:16px 18px 16px;overflow:hidden}
.kt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:6px;white-space:nowrap}
.bsp{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:14px}
.bsp i{flex:1;min-width:2px;border-radius:2px 2px 1px 1px;background:var(--line);transform-origin:50% 100%;animation:barin .6s var(--ease) both}
.bsp i:nth-child(n){animation-delay:calc(var(--k,0) * 1ms)}
.bsp i.last{background:var(--c)}
.kpi:hover .bsp i:not(.last){background:color-mix(in srgb,var(--c) 30%,var(--line))}
.bsp i{transition:background .25s}
.sp{position:relative;height:46px;margin:10px -18px 0;}
.sp svg{display:block;width:100%;height:100%}
.sp i{display:none!important}
.sp i{position:absolute;right:18px;width:8px;height:8px;margin:-4px -4px 0 0;z-index:1;border-radius:50%;background:var(--panel);box-shadow:0 0 0 2px var(--c),0 0 0 6px color-mix(in srgb,var(--c) 15%,transparent)}
.sp svg path:last-child{animation:fade .9s var(--ease) both}
.fun{display:flex;flex-direction:column;gap:14px}
.fun-t{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:13px}
.fun-t span{font-weight:500}
.fun-t em{font-size:12px;color:var(--mut)}
.fun-t b{margin-left:auto;font-weight:500}
.fun-b{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.fun-b i{display:block;height:100%;width:var(--w);border-radius:5px;background:var(--acc);opacity:var(--o);animation:grow .9s var(--ease) both}
.hb{display:flex;flex-direction:column;gap:12px}
.hb li{display:grid;grid-template-columns:24px 52px 1fr 54px;align-items:center;gap:10px;font-size:13px}
.hb b{text-align:right;font-weight:500;font-size:12.5px}
.coh{display:flex;flex-direction:column;gap:4px}
.coh-r{display:grid;grid-template-columns:34px repeat(6,1fr);gap:4px;font-size:12px;color:var(--mut)}
.coh-r>span{display:flex;align-items:center;justify-content:center}
.coh-r>span:first-child{justify-content:flex-start}
.coh-r i{display:grid;place-items:center;height:34px;border-radius:6px;font-style:normal;font-size:12px;font-feature-settings:"tnum";background:color-mix(in srgb,var(--acc) calc(var(--a) * 70% + 8%),var(--panel));color:var(--ink)}
.coh-r i.e{background:var(--line2)}
.coh-r.h span{font-size:11px}

/* ---------- portal ---------- */
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;margin-bottom:14px;border-radius:11px;background:var(--hover);border:1px dashed var(--mut2);font-size:13px;color:var(--txt);flex-wrap:wrap}
.pv-bar b{font-weight:500;color:var(--ink)}
.pv-sw{margin-left:auto;display:flex;gap:4px}
.pv-sw button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--mut)}
.pv-sw button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.portal{border-radius:16px;border:1px solid var(--line);background:var(--bg);overflow:hidden;box-shadow:var(--sh2)}
.pt-h{display:flex;align-items:center;gap:24px;height:64px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.pt-b{display:flex;align-items:center;gap:10px}
.pt-b b{display:block;font-size:14px;font-weight:600}.pt-b small{display:block;font-size:12px;color:var(--mut)}
.pt-n{display:flex;gap:2px;margin-right:auto}
.pt-n button{height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mut)}
.pt-n button.on{background:var(--hover);color:var(--ink)}
.pt-body{padding:22px}
.pt-hero{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:26px 30px;margin-bottom:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--mut)}
.pt-hero h2{margin:6px 0 8px;font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.pt-hero h2 em{font-style:normal;color:var(--acc)}
.pt-hero p{color:var(--txt);max-width:460px}
.pt-ha{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.rt{stroke:var(--line2)}
.rp{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:var(--p) 100;animation:ring 1.4s var(--ease) both}
@keyframes ring{from{stroke-dasharray:0 100}}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;font-weight:500}.ring small{font-size:12px;color:var(--ok)}
.pt-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ms li{position:relative;display:flex;align-items:flex-start;gap:12px;padding-bottom:18px}
.ms li:last-child{padding-bottom:0}
.ms li::before{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:1.5px;background:var(--line)}
.ms li:last-child::before{display:none}
.ms li>i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut2);background:var(--panel);flex:none;color:#fff;transition:all .3s}
.ms li.done>i{background:var(--ok);border-color:var(--ok)}
.ms li.done::before{background:var(--ok)}
.ms li.review>i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-s)}
.ms li>span{flex:1}
.ms b{display:block;font-size:13.5px;font-weight:500}.ms small{font-size:12px;color:var(--mut)}
.inv li,.files li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.inv li:first-child,.files li:first-child{border-top:0;padding-top:0}
.inv-i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--hover);color:var(--txt);flex:none}
.inv-t,.files li>span:nth-child(2){flex:1;min-width:0}
.inv-t b,.files b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-t small,.files small{font-size:12px;color:var(--mut)}
.inv li>b{font-size:13.5px;font-weight:500}
.fx{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-family:var(--fm);font-size:9.5px;font-weight:500;flex:none;background:var(--hover);color:var(--txt)}
.fx.fig{background:var(--vio-s);color:var(--vio)}.fx.pdf{background:var(--bad-s);color:var(--bad)}.fx.zip{background:var(--warn-s);color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:12px;max-height:230px;overflow:auto;margin-bottom:12px}
.msg{display:flex;gap:9px;align-items:flex-end}
.msg p{max-width:82%;padding:10px 12px;border-radius:12px 12px 12px 4px;background:var(--hover);font-size:13px;line-height:1.45}
.msg p b{display:block;font-size:11.5px;font-weight:500;color:var(--mut);margin-bottom:2px}
.msg small{display:block;margin-top:4px;font-size:11px;color:var(--mut)}
.msg.me{justify-content:flex-end}
.msg.me p{background:var(--ink);color:var(--panel);border-radius:12px 12px 4px 12px}
.msg.me small{color:var(--mut2)}
.chat-f{display:flex;gap:6px;padding:5px 5px 5px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2)}
.chat-f input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13.5px}
.chat-f .ib{width:32px;height:32px}
.fadein{animation:vin .4s var(--ease) both}

/* ---------- team ---------- */
.seats{font-size:13px;color:var(--mut)}.seats b{color:var(--ink);font-weight:500}
.you{font-style:normal;font-size:11px;font-weight:500;padding:1px 6px;margin-left:4px;border-radius:5px;background:var(--acc-s);color:var(--acc);vertical-align:1px}
.selw{position:relative;display:inline-flex;align-items:center;font-size:13px}
.selw select{appearance:none;-webkit-appearance:none;height:30px;padding:0 28px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.selw>.i{position:absolute;right:8px;pointer-events:none;color:var(--mut)}
.selw.w{width:100%;height:42px;padding-left:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);gap:8px}
.selw.w select{flex:1;height:100%;border:0;padding-left:0;background:none}
.mfa{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut)}.mfa.on{color:var(--ok)}
.perm td b{display:block;font-weight:500}
.perm .pg{display:block;font-size:11.5px;color:var(--mut)}
.perm td.c .tg2{margin:0 auto;display:block}
.sec{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:14px}
.sr-i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--hover);color:var(--txt);flex:none}
.srow>span:nth-child(2){flex:1;min-width:0}
.srow b{display:block;font-weight:500}.srow small{display:block;font-size:12.5px;color:var(--mut)}
.audit li{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line2)}
.audit li:first-child{border-top:0}
.audit p{flex:1;font-size:13.5px;color:var(--txt)}.audit b{color:var(--ink);font-weight:500}
.audit time{font-size:12.5px;white-space:nowrap}

/* ---------- billing ---------- */
.plan{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,var(--acc-s),transparent 55%),var(--panel)}
.plan-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.plan h2{margin:14px 0 4px;font-size:30px;font-weight:600;letter-spacing:-.04em}
.pp{color:var(--mut);font-size:13.5px}.pp b{color:var(--ink);font-weight:500}
.plan-t{display:flex;justify-content:space-between;margin:20px 0 18px;padding:12px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--txt)}
.plan-t b{color:var(--ink);font-weight:500}
.plan-a{display:flex;gap:8px;flex-wrap:wrap}
.use{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
.use li>div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;font-size:13px;color:var(--txt)}
.use b{font-weight:500;font-size:13px}.use em{font-style:normal;color:var(--mut)}
.addon{display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--txt)}
.addon>.i{color:var(--acc)}.addon span{flex:1}.addon b{font-weight:500;color:var(--ink)}
.plans-s{margin-bottom:16px}
.ps-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.ps-h h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.sw span.on{color:var(--ink);font-weight:500}
.sw .pill{margin-left:4px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pl{position:relative;display:flex;flex-direction:column}
.pl.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pl-b{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--ink);color:var(--panel)}
.pl-n{font-size:15px;font-weight:600}
.pl>p{margin-top:3px;font-size:13px;color:var(--mut)}
.pl-p{display:flex;align-items:baseline;gap:6px;margin:16px 0}
.pl-p b{font-size:32px;font-weight:500;letter-spacing:-.04em}.pl-p span{font-size:12.5px;color:var(--mut)}
.pl ul{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;flex:1}
.pl li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt)}
.pl li .i{color:var(--ok)}
.pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2)}
.cc{display:grid;place-items:center;width:48px;height:34px;border-radius:7px;background:linear-gradient(135deg,#1f2a5a,#3b4fa8);color:#fff;flex:none}
.pm>span:nth-child(2){flex:1;min-width:0}
.pm b{display:block;font-weight:500}.pm small{font-size:12.5px;color:var(--mut)}
.bd{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:18px;font-size:13px}
.bd span{color:var(--mut)}.bd b{font-weight:500;text-align:right}

/* ---------- drawer / modal / overlays ---------- */
.ov{position:fixed;inset:0;z-index:70;visibility:hidden}
.ov.open{visibility:visible}
.ov-bg{position:absolute;inset:0;background:rgba(10,10,12,.32);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ov.open .ov-bg{opacity:1}
.drw{position:absolute;top:8px;right:8px;bottom:8px;width:min(480px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);overflow:auto;transform:translateX(calc(100% + 16px));transition:transform .4s var(--ease)}
.ov.open .drw{transform:none}
.dw-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:20px 20px 16px;background:var(--panel);border-bottom:1px solid var(--line)}

.brand .lg-w,.brand .lg-m{display:none}

body.sb-mini .brand .lg-d,body.sb-mini .brand .lg-w{display:none!important}
body.sb-mini .brand .lg-m{display:block;height:30px}
.nv{gap:10px;padding-left:7px}
.nv .x3{width:24px;height:24px}
.nv .x3{opacity:.92;transition:transform .25s var(--ease),opacity .2s}
.nv:hover .x3{transform:translateY(-1px) scale(1.06);opacity:1}
.nv.on .x3{opacity:1}
html.dark .x3{background:#f1efed;border-radius:28%;padding:2px}
html.dark .brief-x,html.dark .cp-x,html.dark .sb-ai-x,html.dark .pg-x{padding:5px}
html.dark .brief-x{filter:none}
.sb-ai-x{margin:-4px 0 6px -4px}
.brief-x{filter:drop-shadow(0 6px 10px rgba(255,90,31,.18))}
.cp-x{margin:0 auto 12px}
.pg-h>div:first-child:has(.pg-x){display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.pg-x{grid-row:1/3}
.tbi .x3{opacity:.75;filter:saturate(.6)}
.tbi.on .x3{opacity:1;filter:none}
@media (max-width:720px){.pg-x{width:42px;height:42px}}

body.sb-mini .brand .pf-by{display:none!important}
.brand{display:flex;align-items:center}
/* pf-align */.pf-by{transform:translateY(-0.7px)}
/* pf-gap */html body .pf-by.pf-by.pf-by{margin-left:-0.5px!important;gap:7px!important}
/* pf-sb */.sb-top .brand img{height:23px!important}.sb-top .brand .pf-lg{width:81px!important;height:14px!important;background-size:auto 14px!important}.sb-top .sb-col{flex:none;margin-left:8px}
</style>

function smooth(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1] || pts[i], [x1, y1] = pts[i], [x2, y2] = pts[i + 1], [x3, y3] = pts[i + 2] || pts[i + 1];
    const t = .18;
    d += ` C${x1 + (x2 - x0) * t},${y1 + (y2 - y0) * t} ${x2 - (x3 - x1) * t},${y2 - (y3 - y1) * t} ${x2},${y2}`;
  }
  return d;
}
function spark(vals, col = 'var(--acc)', lowGood) {
  const mn = Math.min(...vals) * .82, mx = Math.max(...vals);
  return `<div class="bsp" style="--c:${col}">${vals.map((v, i) => `<i class="${i === vals.length - 1 ? 'last' : ''}" style="height:${(14 + (v - mn) / (mx - mn || 1) * 86).toFixed(1)}%" title=""></i>`).join('')}</div>`;
}
function nice(max) { const steps = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 250000]; for (const s of steps) { if (max / s <= 5) return [Math.ceil(max / s) * s, s]; } return [max, max / 4]; }

  const skip = (W - pl - pr) / labels.length < 36;
  labels.forEach((l, i) => { if ((!skip && labels.length <= 12) || i % 2 === 0) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="ax">${l}</text>`; });
  const id = 'a' + Math.random().toString(36).slice(2, 7);

    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="${s.dash ? 1.6 : 2}" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linecap="round" class="draw-l" pathLength="1"/>`;
  });

    tip.innerHTML = `<b>${labels[i]}</b>` + series.map(s => `<span><i style="background:${s.col}"></i>${s.name}<em>${fmt(s.vals[i])}</em></span>`).join('');
    tip.style.opacity = 1; const tw = tip.offsetWidth; tip.style.transform = `translate(${Math.min(W - tw - 4, Math.max(4, X(i) + 14 > W - tw ? X(i) - tw - 14 : X(i) + 14))}px,${pt + 6}px)`;

}
function comboChart(el, labels, bars, target, opts = {}) {
  const W = el.clientWidth || 600, H = el.clientHeight || 260, pl = 46, pr = 6, pt = 12, pb = 26, fmt = opts.fmt || (v => v >= 1000 ? '$' + +(v / 1000).toFixed(2) + 'k' : '$' + v);
  const [mx, st] = nice(Math.max(...bars) * 1.04), n = labels.length, step = (W - pl - pr) / n;
  const bw = Math.max(4, Math.min(30, step * (n > 20 ? .62 : .54))), X = i => pl + (i + .5) * step, Y = v => pt + (1 - v / mx) * (H - pt - pb), r = Math.min(6, bw / 2.4);

  bars.forEach((v, i) => {

    if (i % every === (n - 1) % every) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="ax">${labels[i]}</text>`;
  });

  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip" style="opacity:0"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const show = i => {
    $$('.cb2', svg).forEach(b => b.classList.toggle('hov', +b.dataset.i === i)); svg.classList.add('hovering');
    const v = bars[i], pv = bars[i - 1], t = target[i], ch = pv ? ((v - pv) / pv * 100) : 0;
    tip.innerHTML = `<b>${opts.tipLabel ? opts.tipLabel(i) : labels[i]}</b><span><i style="background:var(--acc)"></i>Revenue<em>${money(v)}</em></span>${pv ? `<span class="tch ${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '+' : '−'}${Math.abs(ch).toFixed(1)}% vs previous</span>` : ''}`;
    tip.style.opacity = 1; const tw = tip.offsetWidth, x = X(i) + bw / 2 + 10 + tw > W ? X(i) - bw / 2 - 10 - tw : X(i) + bw / 2 + 10;
    tip.style.transform = `translate(${Math.max(4, x)}px,${Math.max(pt, Math.min(Y(v) - 10, H - pb - tip.offsetHeight))}px)`;

  svg.addEventListener('pointerleave', () => { tip.style.opacity = 0; svg.classList.remove('hovering'); $$('.cb2', svg).forEach(b => b.classList.remove('hov')); });
  el._hover = show;
}
function barChart(el, labels, stacks, fmt = kfmt) {
  const W = el.clientWidth || 600, H = el.clientHeight || 240, pl = 44, pr = 6, pt = 10, pb = 26;
  const tot = labels.map((_, i) => stacks.reduce((a, s) => a + s.vals[i], 0)), [mx, st] = nice(Math.max(...tot));

let drag = null;
function initPipeline() {
  const b = $('#board'); if (!b) return;
  b.addEventListener('pointerdown', e => {
    const c = e.target.closest('.dc'); if (!c || e.target.closest('button') || e.button !== 0) return;
    drag = { c, x: e.clientX, y: e.clientY, on: false, id: c.dataset.id };
  });
}
addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const r = drag.c.getBoundingClientRect(); drag.on = true; drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    drag.g = drag.c.cloneNode(true); drag.g.classList.add('ghost'); drag.g.style.width = r.width + 'px'; document.body.appendChild(drag.g);
    drag.ph = document.createElement('div'); drag.ph.className = 'ph'; drag.ph.style.height = r.height + 'px'; drag.c.after(drag.ph); drag.c.classList.add('lift'); drag.c.style.display = 'none'; document.body.classList.add('dragging');
  }
  drag.g.style.transform = `translate(${e.clientX - drag.dx}px,${e.clientY - drag.dy}px) rotate(2.5deg)`;
  const col = $$('.col').find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right; });
  $$('.col').forEach(c => c.classList.toggle('over', c === col));
  if (col) { const l = $('.col-l', col), cards = $$('.dc', l).filter(x => x !== drag.c); const nx = cards.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }); nx ? l.insertBefore(drag.ph, nx) : l.appendChild(drag.ph); }
  const bd = $('#board'), br = bd.getBoundingClientRect(); if (e.clientX > br.right - 60) bd.scrollLeft += 12; else if (e.clientX < br.left + 60) bd.scrollLeft -= 12;
});
addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.on) return;
  document.body.classList.remove('dragging'); d.g.remove(); $$('.col').forEach(c => c.classList.remove('over'));
  const col = d.ph.closest('.col'), deal = DEALS.find(x => x.id === d.id), prev = deal.stage;
  if (col) {
    deal.stage = col.dataset.stage; if (deal.stage === 'won') deal.prob = 100; else if (prev === 'won') deal.prob = 70;
    const order = []; $$('.col').forEach(c => $$('.dc, .ph', c).forEach(x => order.push(x.classList.contains('ph') ? d.id : x.dataset.id)));
    DEALS.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  }
  render(false);
  if (col && prev !== deal.stage) toast(deal.stage === 'won' ? `Deal won — ${deal.co} · ${money(deal.value)}` : `${deal.name} moved to ${stageOf(deal.stage).name}`, deal.stage === 'won' ? 'star' : 'board');
  updBadges();
});

/* ================= command palette ================= */
function cmdItems(q) {
  q = q.toLowerCase();
  const pages = Object.entries(TITLES).map(([id, t]) => ({ g: 'Pages', t, ic: NAV.flatMap(n => n[1]).find(x => x[0] === id)[1], act: () => go(id) }));
  const acts = [{ g: 'Actions', t: 'Create new deal', ic: 'plus', k: 'N', act: () => openModal(mNewDeal()) }, { g: 'Actions', t: 'Invite team members', ic: 'userplus', act: () => openModal(mInvite()) }, { g: 'Actions', t: 'Ask Clarix AI', ic: 'spark', act: () => openCP() }, { g: 'Actions', t: 'Toggle dark mode', ic: 'moon', act: () => toggleTheme() }];
  const deals = DEALS.map(d => ({ g: 'Deals', t: d.name, s: d.co + ' · ' + money(d.value), logo: d.co, act: () => openDrawer(dealDrawer(d.id)) }));
  const people = CONTACTS.map(c => ({ g: 'Contacts', t: c.name, s: c.title + ' · ' + c.co, av: c.name, act: () => openDrawer(contactDrawer(c.id)) }));
  const all = [...pages, ...acts, ...deals, ...people].filter(x => !q || (x.t + ' ' + (x.s || '')).toLowerCase().includes(q));
  return q ? all.slice(0, 12) : [...acts, ...pages.slice(0, 4), ...deals.slice(0, 3)];
}
let CMD = [];
function drawCmd() {
  CMD = cmdItems($('#cmdq').value); S.cmdI = Math.min(S.cmdI, Math.max(0, CMD.length - 1)); let g = '';
  $('#cmdl').innerHTML = CMD.map((x, i) => { const h = x.g !== g ? `<small class="cmd-g">${x.g}</small>` : ''; g = x.g; return h + `<button class="cmd-i ${i === S.cmdI ? 'on' : ''}" data-act="cmdgo" data-i="${i}">${x.logo ? logo(x.logo, 22) : x.av ? av(x.av, 22) : `<span class="ci">${I(x.ic, 16)}</span>`}<span>${x.t}${x.s ? `<small>${x.s}</small>` : ''}</span>${x.k ? `<kbd>${x.k}</kbd>` : I('right', 14)}</button>`; }).join('') || `<p class="cmd-e">No results for “${esc($('#cmdq').value)}”</p>`;
}

function closeAll() { $$('.ov.open').forEach(o => { o.classList.remove('open'); o.setAttribute('aria-hidden', 'true'); }); closePop(); lock(); }
function openDrawer(html) { closePop(); $('#drw').innerHTML = html; $('#drw').scrollTop = 0; $('#cmdk').classList.remove('open'); openOv('dr'); }

let popFor = null;
function openPop(btn, html, w = 340) {
  if (popFor === btn) return closePop();
  const p = $('#pop'); w = Math.min(w, document.documentElement.clientWidth - 24); p.innerHTML = html; p.style.width = w + 'px'; p.classList.add('open'); popFor = btn;
  const r = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth;
  p.style.left = Math.max(12, Math.min(r.right - w, vw - w - 12)) + 'px'; p.style.top = r.bottom + 8 + 'px';
}
function closePop() { $('#pop').classList.remove('open'); popFor = null; }
function notifHTML() { return `<header class="ph2"><b>Notifications</b><button class="lnk" data-act="readall">Mark all as read</button></header><ul class="nl">${NOTIFS.map(([w, t, when, un]) => `<li class="${un ? 'un' : ''}">${w === 'Clarix AI' ? `<span class="av ai">${I('spark', 14)}</span>` : av(w, 32)}<p><b>${w}</b> ${t}<small>${when}</small></p>${un ? '<i></i>' : ''}</li>`).join('')}</ul><footer class="pf"><button class="lnk" data-act="soon">Notification settings</button></footer>`; }

  const h = $('.pg-h>div:first-child', el); if (h && S.route !== 'dashboard') h.insertAdjacentHTML('afterbegin', X3(S.route, 52, 'pg-x'));

function go(r) { if (!VIEWS[r]) r = 'dashboard'; closeAll(); setMenu(false); if (S.route !== r) { S.route = r; S.sel.clear(); try { history.replaceState(null, '', '#/' + r); } catch (e) { } render(); $('#view').scrollTop = 0; scrollTo(0, 0); } else render(false); }

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  if ($('#pop').classList.contains('open') && !t.closest('#pop') && !t.closest('[data-act="notifs"],[data-act="me"],[data-act="ws"]')) closePop();
  const sg = t.closest('[data-seg] button'); if (sg) {
    const box = sg.parentElement, k = box.dataset.seg; $$('button', box).forEach(b => b.classList.toggle('on', b === sg));
    if (k === 'period') { S.period = sg.dataset.v; initDashboard(); }

    return;
  }
  const ch = t.closest('[data-chips] .chp'); if (ch) { S.pFilter = ch.dataset.v; render(false); return; }
  const tb = t.closest('[data-tabs] button'); if (tb) { const k = tb.parentElement.dataset.tabs; if (k === 'ctab') { S.cTab = tb.dataset.v; S.cPage = 1; render(false); } if (k === 'ttab') { S.tTab = tb.dataset.v; render(false); } return; }
  const a = t.closest('[data-act],[data-go]'); if (!a) return;
  if (a.dataset.go) { e.preventDefault(); go(a.dataset.go); return; }
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'collapse': document.body.classList.toggle('sb-mini'); setTimeout(chartsRedraw, 320); break;
    case 'menu': e.preventDefault(); setMenu(!document.body.classList.contains('menu-open')); break;

    case 'cmdk': openCmd(); break;

    case 'theme': toggleTheme(); closePop(); break;
    case 'notifs': openPop(a, notifHTML(), 360); break;
    case 'readall': NOTIFS.forEach(n => n[3] = false); $('#pop').innerHTML = notifHTML(); $('.bdot').style.display = 'none'; break;
    case 'me': openPop(a, `<div class="mm">${[['user', 'users', 'Profile'], ['gear', 'gear', 'Preferences'], ['card', 'card', 'Billing & plan', 'billing'], ['shield', 'shield', 'Team & roles', 'team']].map(([, ic, tx, r]) => `<button ${r ? `data-go="${r}"` : 'data-act="soon"'}>${I(ic, 16)}${tx}</button>`).join('')}<button data-act="theme">${I(document.documentElement.classList.contains('dark') ? 'sun' : 'moon', 16)}${document.documentElement.classList.contains('dark') ? 'Light mode' : 'Dark mode'}</button><hr><button data-act="soon">${I('logout', 16)}Sign out</button></div>`, 220); break;

    case 'copilot': openCP(); break;
    case 'copilot-q': openCP(); setTimeout(() => cpAsk(+a.dataset.q), 380); break;
    case 'cpq': cpAsk(+a.dataset.q); break;
    case 'cp-new': cpHome(); break;
    case 'cpact': toast(a.dataset.t + ' — done', 'spark'); break;
    case 'close': if (a.closest('#cp')) closeCP(); else closeAll(); break;
    case 'newdeal': openModal(mNewDeal(a.dataset.stage || 'lead')); break;
    case 'invite': openModal(mInvite()); break;
    case 'deal': if (drag) return; openDrawer(dealDrawer(id)); break;

    case 'setstage': { const d = DEALS.find(x => x.id === id); d.stage = a.dataset.s; d.prob = d.stage === 'won' ? 100 : Math.max(10, STAGES.findIndex(s => s.id === d.stage) * 20 + 10); $('#drw').innerHTML = dealDrawer(id); if (S.route === 'pipeline' || S.route === 'dashboard') render(false); updBadges(); toast(`${d.name} moved to ${stageOf(d.stage).name}`, 'board'); break; }

  if (f.dataset.form === 'chat') { const m = f.m.value.trim(); if (!m) return; $('#chat').insertAdjacentHTML('beforeend', `<div class="msg me fadein"><p>${esc(m)}<small>now</small></p></div>`); f.reset(); $('#chat').scrollTop = 1e5; setTimeout(() => { $('#chat').insertAdjacentHTML('beforeend', `<div class="msg them fadein">${av('Lucas Romero', 26)}<p><b>Lucas · Northpeak</b>Thanks Daniel — noted, I’ll update the board.<small>now</small></p></div>`); $('#chat').scrollTop = 1e5; }, 1200); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmdk').classList.contains('open') ? closeAll() : openCmd(); return; }
  if (e.key === 'Escape') { if ($('.ov.open') || $('#pop').classList.contains('open')) closeAll(); else if ($('#cp').classList.contains('open')) closeCP(); else setMenu(false); return; }
  if ($('#cmdk').classList.contains('open')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.cmdI = (S.cmdI + (e.key === 'ArrowDown' ? 1 : -1) + CMD.length) % CMD.length; drawCmd(); $('.cmd-i.on') && $('.cmd-i.on').scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); const x = CMD[S.cmdI]; closeAll(); x && x.act(); }
    if (e.key === 'Tab') { e.preventDefault(); const q = $('#cmdq').value; closeAll(); openCP(); if (q) setTimeout(() => cpAsk(0, q), 380); }
  }
  if (e.key === 'Enter' && e.target.matches('.dc')) e.target.click();
});
document.addEventListener('input', e => { if (e.target.id === 'cmdq') { S.cmdI = 0; drawCmd(); } });
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { chartsRedraw(); if (innerWidth > 1080) setMenu(false); closePop(); }, 120); });
addEventListener('hashchange', () => { const r = location.hash.replace('#/', ''); if (VIEWS[r] && r !== S.route) go(r); });

/* ================= init ================= */
shell();
try { if (localStorage.getItem('clarix-theme') === 'dark') toggleTheme(true); } catch (e) { }
{ const r = location.hash.replace('#/', ''); if (VIEWS[r]) S.route = r; }
render();
