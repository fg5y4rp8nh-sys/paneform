<style>:root{--navy:#0E3A5E;--navy-d:#071F30;--blue:#3A9AD9;--blue-d:#2B86C3;--teal:#00B4D0;--ink:#404041;--dark:#231F20;--mut:#8a94a0;--line:#E8F4FD;--line2:#E3EBF2;--soft:#F7FBFF;--sky:#DBEAFE;--wa:#25D366;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Poppins",system-ui,sans-serif;font-size:16px;line-height:1.5;font-weight:400;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:"Poppins",sans-serif;margin:0;color:var(--navy)}
p{margin:0}
a{color:var(--blue);text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.i{flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:10px;font-family:"Poppins";font-weight:400;font-size:15px;line-height:1.3;padding:14px 28px;min-height:50px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s;text-align:center}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-navy{background:var(--navy);color:#F7FBFF}
.btn-navy:hover{background:#14507f}
.btn-line{background:transparent;color:#1A3A52;border-color:#1A3A52}
.btn-line:hover{background:#1A3A52;color:#fff}
.btn-ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-ghost-w:hover{background:#fff;color:var(--navy)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-sm{padding:10px 14px;min-height:40px;font-size:13px}
.btn-lg{padding:15px 30px;min-height:52px}
.btn.full{width:100%}
.link{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-weight:500}
.pill{display:inline-block;background:rgba(0,180,208,.08);border:1px solid rgba(0,180,208,.3);color:var(--ink);font-size:14px;padding:4px 14px;border-radius:999px;margin-bottom:16px}

/* logo */
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;color:inherit}
.logo svg{width:40px;height:40px}
.logo span{display:flex;flex-direction:column;line-height:1}
.logo b{font-weight:600;font-size:19px;color:var(--navy);letter-spacing:-.3px}
.logo small{font-size:9px;font-weight:500;letter-spacing:2.6px;color:var(--blue);margin-top:4px}

/* top bar + header */
.topbar{background:var(--navy);color:#cfe0ee;font-size:13px;font-weight:300}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;height:36px}
.topbar span{display:inline-flex;align-items:center;gap:8px}
.topbar .i{width:15px;height:15px}
.tb-r{gap:22px!important}
.tb-r a{display:inline-flex;align-items:center;gap:6px;color:#fff}
.hdr{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line2)}
.hdr-in{display:flex;align-items:center;gap:28px;height:74px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font-size:15px;color:var(--ink);padding:8px 13px;border-radius:8px}
.nav a:hover{color:var(--blue)}
.hdr-r{display:flex;align-items:center;gap:8px}
.burger{display:none;width:44px;height:44px;border:0;background:none;border-radius:8px;align-items:center;justify-content:center;color:var(--navy)}
.burger.show{display:inline-flex}

/* mobile sheet */
.sheet{position:fixed;inset:0;z-index:90;visibility:hidden}
.sheet.open{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(7,31,48,.5);opacity:0;transition:opacity .25s}
.sheet.open .sheet-bg{opacity:1}
.sheet-p{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto}
.sheet.open .sheet-p{transform:none}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:0 12px 0 20px;height:68px;border-bottom:1px solid var(--line2);flex-shrink:0}
.sheet nav{display:flex;flex-direction:column;padding:6px 0}
.sheet nav a{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;font-size:17px;color:var(--navy);border-bottom:1px solid var(--line)}
.sheet nav a .i{color:var(--mut)}
.sheet-b{margin-top:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.sheet-b .soc-row{justify-content:center;margin-top:8px}

/* media */
.media{position:relative;margin:0;overflow:hidden;border-radius:var(--r);background:#e3edf6;width:100%}
.media img{width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8ba0b6;background:#e9f1f8}
.ph span{font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase}

/* hero */
.hero{position:relative;background:var(--navy) var(--bg,none) center/cover;color:#fff;padding:64px 0 72px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,58,94,.95) 0%,rgba(14,58,94,.86) 45%,rgba(30,96,150,.7) 100%)}
.hero-bg{display:none}
.hero-ph{position:absolute;right:20px;bottom:14px;font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.4);z-index:1}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero-in>*{min-width:0}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:300;color:#bcd3e6;margin-bottom:20px}
.crumbs a{color:#fff}
.hero h1{color:#fff;font-size:44px;line-height:1.3;font-weight:700;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:inherit}
.hero-t>p{font-size:16px;line-height:1.6;color:#e1ecf5;margin-top:18px;max-width:560px;font-weight:300}
.kpis{display:flex;flex-wrap:wrap;gap:16px 48px;margin-top:30px}
.kpis div{display:flex;flex-direction:column;max-width:170px;padding-top:4px}
.kpis b{font-weight:500;font-size:30px;line-height:1.3;color:#fff}
.kpis span{font-size:13px;color:#bcd3e6;font-weight:300;line-height:1.4}
.kpis b span{font-size:inherit;color:inherit;font-weight:inherit;line-height:inherit;display:inline}
.kpis b{display:block;margin-bottom:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero-a{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-note{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:300;color:#bcd3e6;margin-top:16px}
.hero-note .i{width:17px;height:17px;color:#7cc4f0}
.h-anim{opacity:0;transform:translateY(14px);animation:up .7s ease forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
@keyframes up{to{opacity:1;transform:none}}

/* 3D model */
.model{position:relative;height:520px;cursor:grab;user-select:none;-webkit-user-select:none}
.model.grab{cursor:grabbing}
.model canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.model-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#dbe8f3;text-align:center;padding:24px}
.model-fallback .i{width:80px;height:80px;color:#7cc4f0}
.model.no-gl .model-fallback{display:flex}
.model.no-gl .model-ui,.model.no-gl .model-hint,.model.no-gl .mlabel{display:none}
.mlabel{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12.5px;font-weight:400;color:var(--navy);background:#fff;padding:5px 12px 5px 7px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.15);opacity:0;transition:opacity .35s;margin:-14px 0 0 -7px;will-change:transform}
.mlabel.on{opacity:1}
.mlabel b{font-weight:400}
.mlabel em{display:none;font-style:normal}
.mlabel.flip{flex-direction:row-reverse;padding:5px 7px 5px 12px}
.mlabel i{width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.model-ui{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:8px}
.model-ui button{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;white-space:nowrap;min-height:40px;transition:.2s}
.model-ui button:hover{background:rgba(255,255,255,.12)}
.model-ui button[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff}
.model-hint{position:absolute;right:8px;top:6px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:300;color:#bcd3e6}

/* benefits strip */
.strip{background:#fff;border-bottom:1px solid var(--line2)}
.strip-in{display:flex;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.strip span{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:300;color:var(--dark)}
.strip span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}

/* sections */
.sec{padding:96px 0}
.sec-tight{padding:64px 0}
.sec-soft{background:var(--soft)}
.sec-h{max-width:720px;margin-bottom:48px}
.sec-h.c{margin-left:auto;margin-right:auto;text-align:center}
.sec-h.row{max-width:none;display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
.sec-h.row>div:first-child{max-width:640px}
.sec-h h2{font-size:44px;line-height:1.2;font-weight:700;letter-spacing:-1px}
.split-t h2{font-size:30px;line-height:1.3;font-weight:700;letter-spacing:-.5px}
.sec-h p{font-size:16px;color:var(--ink);margin-top:16px;font-weight:300}
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split-t>p{font-size:16px;line-height:1.65;color:var(--ink);margin-top:16px;font-weight:300}
.split-t>p b{font-weight:600;color:var(--navy)}
.split-t .btn{margin-top:28px}
.ticks{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
.ticks li,.inc li,.jc li{position:relative;padding-left:22px;font-size:15px;line-height:1.5}
.ticks li::before,.inc li::before,.jc li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:rgba(58,154,217,.25);box-shadow:inset 0 0 0 2px var(--blue)}
.tall{aspect-ratio:4/5}

/* reveal */
[data-r]{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0ms)}
[data-r].in{opacity:1;transform:none}

/* before/after */
.ba{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.ba-img{position:absolute;inset:0}
.ba-img .media{height:100%;border-radius:0}
.ba-after{clip-path:inset(0 0 0 var(--pos))}
.ba-after .ph{background:#dcebf8;align-items:flex-end;padding-right:12%}
.ba-before .ph{align-items:flex-start;padding-left:12%}
.ba-tag{position:absolute;top:14px;left:14px;background:#fff;color:var(--dark);font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px}
.ba-tag.r{left:auto;right:14px}
.ba-line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.ba-knob{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.ba-range{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;pointer-events:none}

/* price */
.pcard{display:grid;grid-template-columns:1.15fr 1fr;background:var(--navy);color:#fff;border-radius:22px;overflow:hidden}
.pcard-l{padding:52px 52px 48px}
.pk{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#9fd1f3}
.pcard h2{color:#fff;font-size:37px;line-height:1.25;font-weight:700;letter-spacing:-1px;margin-top:14px;max-width:540px}
.pc-inc{color:#cfe0ee;margin-top:16px;font-weight:300}
.inc{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.inc li{color:#fff;font-weight:300}
.inc li::before{background:rgba(124,196,240,.25);box-shadow:inset 0 0 0 2px #7cc4f0}
.pcard .fine{color:#a9c1d6;margin-top:24px}
.pcard .fine b{color:#fff;font-weight:500}
.pcard-r{background:#fff;color:var(--ink);margin:12px;border-radius:16px;padding:34px 32px;display:flex;flex-direction:column}
.cur{display:flex;align-self:flex-start;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.cur button{border:0;background:none;font-size:13px;padding:7px 12px;border-radius:7px;color:var(--ink);min-height:34px}
.cur button.on{background:var(--navy);color:#fff}
.big{margin-top:20px;display:flex;flex-direction:column}
.big span{font-size:48px;font-weight:700;line-height:1.15;color:var(--navy);letter-spacing:-1px}
.big small{font-size:14px;color:var(--ink);margin-top:4px;font-weight:300}
.cmp{margin:26px 0;display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:1px solid var(--line2)}
.cmp h4{font-size:14px;font-weight:500;color:var(--navy)}
.bar div{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:6px}
.bar span{font-weight:300}
.bar b{font-weight:500;color:var(--dark);white-space:nowrap}
.bar i{display:block;height:6px;border-radius:3px;background:#e1e8ef;width:0;transition:width 1.1s ease .2s}
.bar.me b{color:var(--blue-d)}
.bar.me i{background:var(--blue)}
.in .bar i{width:var(--w)}
.pcard-r .btn{margin-top:auto}
.fine{font-size:12.5px;line-height:1.55;color:var(--mut);font-weight:300}
.fine.c{text-align:center;margin-top:12px}

/* journey */
.jr{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;--p:0}
.jr-line{display:none}
.jc{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.jc-n{display:none}
.jc-k{display:block;font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
.jc h3{font-size:22px;font-weight:400;margin-top:8px}
.jc-d{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:300;margin-top:6px}
.jc-d .i{width:15px;height:15px;color:var(--blue)}
.jc ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.jc li{font-weight:300}

/* days */
.days{max-width:880px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.days-t{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.days-t button{border:0;border-right:1px solid var(--line);background:none;padding:12px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.3;color:var(--ink);min-height:62px;transition:background .2s}
.days-t button:last-child{border-right:0}
.days-t small{font-size:11px;font-weight:300;text-transform:uppercase;letter-spacing:.6px}
.days-t b{font-size:20px;font-weight:500}
.days-t button:hover{background:var(--soft)}
.days-t button.on{background:var(--navy);color:#fff}
.days-p{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 32px}
.days-p.sw .dp{animation:up .4s ease}
.dp{display:flex;gap:20px;align-items:flex-start}
.dp-i{width:52px;height:52px;border-radius:12px;background:#E6F7F8;color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dp-k{font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
.dp h3{font-size:22px;font-weight:400;margin:2px 0 6px}
.dp p{color:var(--ink);font-size:15px;max-width:560px;font-weight:300}
.dp-nav{display:flex;gap:8px;flex-shrink:0}
.btn-arrow{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.btn-arrow:first-child .i{transform:rotate(180deg)}
.btn-arrow:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn-arrow:disabled{opacity:.35;cursor:default}

/* about */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.vs div{border:1px solid var(--line2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column}
.vs b{font-size:30px;font-weight:600;color:var(--mut);line-height:1.3}
.vs span{font-size:13px;color:var(--ink);font-weight:300}
.vs .vs-me{border-color:var(--blue);background:var(--soft)}
.vs .vs-me b{color:var(--blue)}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ac{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.ac-i{width:48px;height:48px;border-radius:10px;background:var(--sky);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.ac h3{font-size:18px;font-weight:400}
.ac p{color:var(--ink);margin-top:10px;font-size:14.5px;line-height:1.6;font-weight:300}

/* excellence */
.navy{background:var(--navy);color:#fff}
.navy h2{color:#fff}
.navy .sec-h p{color:#cfe0ee}
.navy .pill{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.exc{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:30px 28px;background:rgba(255,255,255,.03)}
.exc-n{font-size:30px;font-weight:300;line-height:1;color:rgba(255,255,255,.35)}
.exc h3{color:#fff;font-size:18px;font-weight:400;margin-top:20px}
.exc p{color:#cfe0ee;margin-top:10px;font-size:14.5px;line-height:1.6;font-weight:300}
.ex-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:56px;border-top:1px solid rgba(255,255,255,.12)}
.ex-stats div{padding:26px 20px 0;display:flex;flex-direction:column;gap:2px;border-left:1px solid rgba(255,255,255,.12)}
.ex-stats div:first-child{border-left:0;padding-left:0}
.ex-stats b{font-size:32px;font-weight:500;color:#fff;line-height:1.3}
.ex-stats span{color:#bcd3e6;font-size:14px;font-weight:300}

/* dentists */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc .media{border-radius:0}
.doc-b{padding:22px 24px 24px}
.doc h3{font-size:19px;font-weight:500}
.doc-r{display:block;color:var(--blue);font-size:14px;margin-top:2px}
.doc p{color:var(--ink);font-size:14.5px;margin-top:12px;line-height:1.6;font-weight:300}
.doc-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.doc-t span{font-size:12px;background:rgba(0,180,208,.08);border:1px solid rgba(0,180,208,.25);color:var(--ink);padding:3px 10px;border-radius:999px}

/* gallery */
.addr-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:360px;flex-shrink:0}
.addr-card .i{color:var(--blue);margin-top:2px}
.addr-card div{display:flex;flex-direction:column;font-size:14px;line-height:1.5}
.addr-card b{font-weight:500;color:var(--navy)}
.addr-card span{color:var(--ink);font-weight:300}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:14px}
.g{position:relative;border-radius:14px;overflow:hidden}
.g.wide{grid-column:span 2}
.g .media{height:100%;border-radius:0}
.g .ph{justify-content:flex-start;padding-top:22px}
.g-cap{position:absolute;left:12px;bottom:12px;font-size:12.5px;color:#fff;background:rgba(7,31,48,.6);padding:4px 10px;border-radius:6px;max-width:calc(100% - 24px)}

/* faq */
.faq-w{display:grid;grid-template-columns:.9fr 1.3fr;gap:64px;align-items:start}
.faq-w .sec-h{margin:0;position:sticky;top:100px}
.faq-w .sec-h h2{font-size:36px}
.faq{border-top:1px solid var(--line2)}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-size:16px;font-weight:400;color:var(--navy);cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.fq-i{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue);transition:transform .25s}
.faq details[open] .fq-i{transform:rotate(180deg)}
.fq-a{padding:0 0 20px}
.fq-a p{color:var(--ink);font-size:15px;line-height:1.65;font-weight:300}

/* cta */
.cta-s{padding-top:0}
.cta{text-align:center;display:flex;flex-direction:column;align-items:center;padding:24px 0 16px}
.cta h2{font-size:44px;line-height:1.2;font-weight:700;letter-spacing:-1px}
.cta p{font-size:16px;color:var(--ink);max-width:620px;margin-top:16px;font-weight:300}
.cta-a{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.cta-a .btn-line .i{color:var(--wa)}
.cta-a .btn-line:hover .i{color:#fff}
.cta-n{font-size:13px;color:var(--mut);margin-top:14px;font-weight:300}

/* footer */
.ftr{background:var(--navy-d);color:#b5c7d6;padding:64px 0 28px;font-size:14px;font-weight:300}
.ftr .logo b{color:#fff}
.ftr .logo small{color:#7cc4f0}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.5fr;gap:40px}
.fbrand p{margin:16px 0 20px;max-width:300px}
.fcol{display:flex;flex-direction:column;gap:10px}
.fcol h4{color:#fff;font-size:15px;font-weight:500;margin-bottom:6px}
.fcol a,.fa{display:inline-flex;align-items:flex-start;gap:9px;color:#b5c7d6;line-height:1.5;word-break:break-word}
.fcol a:hover{color:#fff}
.fcol .i{width:16px;height:16px;margin-top:3px;color:#7cc4f0}
.soc-row{display:flex;gap:8px;flex-wrap:wrap}
.soc{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);color:#fff;transition:.2s}
.soc:hover{background:var(--blue);border-color:var(--blue)}
.sheet .soc{border-color:var(--line2);color:var(--navy)}
.fbot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}

.fl a{color:#b5c7d6}
.fdis{font-size:12px;color:#7d93a6;margin-top:12px}

/* fab + mobile bar */
.fab{position:fixed;right:24px;bottom:24px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab-b{width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(14,58,94,.3)}
.fab.open .fab-b{background:var(--navy)}
.fab-m{width:280px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(14,58,94,.22);padding:6px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s ease}
.fab.open .fab-m{opacity:1;transform:none;pointer-events:auto}
.fab-h{padding:12px 12px 8px;display:flex;flex-direction:column}
.fab-h b{font-weight:500;color:var(--navy)}
.fab-h span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);font-weight:300}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wa)}
.fab-m>button,.fab-m>a{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--ink)}
.fab-m>button:hover,.fab-m>a:hover{background:var(--soft)}
.fab-m>* svg.i{width:36px;height:36px;padding:8px;border-radius:9px;background:var(--sky);color:var(--navy)}
.fab-m>button[data-act=wa] svg.i{background:#e5f9ed;color:#18a94f}
.fab-m span{display:flex;flex-direction:column;line-height:1.3}
.fab-m span b{font-weight:500;font-size:14.5px}
.fab-m span small{font-size:12.5px;color:var(--mut)}
.mbar{display:none}

/* modal */
.modal,.pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;visibility:hidden}
.modal.open,.pop.open{visibility:visible}
.modal-bg,.pop-bg{position:absolute;inset:0;background:rgba(7,31,48,.55);opacity:0;transition:opacity .25s}
.open .modal-bg,.open .pop-bg{opacity:1}
.modal-p{position:relative;width:min(880px,100%);max-height:calc(100vh - 40px);background:#fff;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:.85fr 1.15fr;opacity:0;transform:translateY(16px);transition:.3s ease}
.open .modal-p{opacity:1;transform:none}

.modal-side .media{position:absolute;inset:0;height:100%;border-radius:0}

.modal-c{position:relative;padding:40px 38px 34px;overflow-y:auto;max-height:calc(100vh - 40px)}
.modal-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--navy);z-index:2}

.m-prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding-right:44px;min-height:28px}
.m-prog button{border:0;background:none;color:var(--blue)}
.m-bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 24px;overflow:hidden}

.m-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:15px 16px;font-size:15px;text-align:left;color:var(--navy);min-height:54px;transition:.2s}

.m-row{display:flex;justify-content:center;margin-top:16px}
.m-form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}

.f input,.f select{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:15px;outline:0;background:#fff;width:100%}
.f input:focus,.f select:focus{border-color:var(--blue)}
.f2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.err{color:#d64545;font-size:14px}
.m-done{text-align:center;display:flex;flex-direction:column;align-items:center}
.m-ok{width:60px;height:60px;border-radius:50%;background:#e5f9ed;color:#18a94f;display:flex;align-items:center;justify-content:center;margin-bottom:16px}

.m-sum{list-style:none;margin:20px 0;width:100%;background:var(--soft);border-radius:12px;padding:4px 16px;text-align:left}
.m-sum li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.m-sum li:last-child{border:0}
.m-sum span{font-weight:300}

.pop-p{position:relative;width:min(440px,100%);background:#fff;border-radius:18px;padding:38px 30px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(16px);transition:.3s ease}
.pop.open .pop-p{opacity:1;transform:none}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s ease;z-index:120;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}[data-r],.h-anim{opacity:1!important;transform:none!important}}

/* ===== hero arch (layered 3D renders) ===== */
.arch-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.arch{position:relative;width:100%;max-width:600px;aspect-ratio:1000/766;--mx:0;--my:0}
.arch::before{content:"";position:absolute;left:12%;right:12%;bottom:2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);filter:blur(6px);opacity:0;transition:opacity .8s}
.arch.go::before{opacity:1}
.arch-in{position:absolute;inset:0;transform:perspective(1100px) rotateY(calc(var(--mx)*7deg)) rotateX(calc(var(--my)*-5deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.arch.done .arch-in{animation:float 6s ease-in-out 0.4s infinite}
@keyframes float{50%{translate:0 -8px}}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stk,.bw{position:absolute;inset:0}
.stk{transition:opacity .6s ease}
.l-full{opacity:0;transition:opacity .6s ease}
.arch.done:not(.open) .l-full{opacity:1}
.arch.done:not(.open) .stk{opacity:0}
.bw{transition:transform .8s cubic-bezier(.3,.8,.25,1)}
.arch.open .bw{transform:translateY(-24%)}
.l-jaw,.l-imp,.l-br{opacity:0}
.arch.go .l-jaw{animation:jawIn .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes jawIn{from{opacity:0;transform:translateY(6%) scale(.94)}to{opacity:1;transform:none}}
.arch.go .l-imp{animation:impIn .75s cubic-bezier(.2,.75,.25,1) forwards}
.arch.go .i1{--sx:-13%;--sy:-26%;animation-delay:.55s}
.arch.go .i2{--sx:0%;--sy:-34%;animation-delay:.75s}
.arch.go .i3{--sx:0%;--sy:-34%;animation-delay:.95s}
.arch.go .i4{--sx:13%;--sy:-26%;animation-delay:1.15s}
@keyframes impIn{0%{opacity:0;transform:translate(var(--sx),var(--sy))}35%{opacity:1}100%{opacity:1;transform:none}}
.arch.go .l-br{animation:brIn .9s cubic-bezier(.25,.9,.3,1.12) 1.75s forwards}
@keyframes brIn{0%{opacity:0;transform:translateY(-34%)}30%{opacity:1}100%{opacity:1;transform:none}}
.alabel{position:absolute;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12.5px;color:var(--navy);background:#fff;padding:5px 12px 5px 7px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;pointer-events:none}
.alabel i{width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.arch.lbl .alabel{opacity:1;transform:none}
.arch.lbl .a2{transition-delay:.12s}.arch.lbl .a3{transition-delay:.24s}
.a1{left:56%;top:4%}
.a2{left:32%;top:84%}
.a3{right:-2%;top:46%;flex-direction:row-reverse;padding:5px 7px 5px 12px}
.arch-ui{display:flex;gap:8px}
.arch-ui button{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;min-height:40px;transition:.2s;white-space:nowrap}
.arch-ui button:hover{background:rgba(255,255,255,.12)}
.arch-ui button[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff}
/* WebGL model moved into "What is All-on-4" */
.model-card{background:var(--navy);border-radius:var(--r);overflow:hidden;position:relative}

/* exploded view (What is All-on-4) */
.xv-card{background:radial-gradient(80% 70% at 50% 45%,#1d5585 0%,var(--navy) 70%);border-radius:var(--r);padding:28px 24px 20px;position:relative;overflow:hidden}
.xv{position:relative;aspect-ratio:1000/930}
.xi{position:absolute;left:0;right:0;bottom:0;aspect-ratio:1000/766}
.xi img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.xb{animation:xfloat 4.5s ease-in-out infinite;transform:translateY(-24%)}
@keyframes xfloat{50%{transform:translateY(-19%)}}

/* ===== implant story ===== */
.imp-s{background:var(--navy-d);color:#fff;position:relative}
.imp-pin{padding:96px 0}
.imp-g{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.imp-t h2{color:#fff;font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.2}
.imp-s .pill{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.imp-lead{color:#b5c7d6;margin-top:14px;font-weight:300}
.isteps{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-direction:column;gap:6px}
.istep{display:flex;gap:18px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:16px 18px;border-radius:14px;border-left:2px solid rgba(255,255,255,.12);transition:background .35s,border-color .35s,opacity .35s;opacity:.5}
.istep:hover{opacity:.8}
.istep.on{opacity:1;background:rgba(255,255,255,.05);border-left-color:var(--sky,#4FB3EA)}
.is-n{font-size:14px;font-weight:600;color:#7cc4f0;padding-top:2px}
.is-b{display:flex;flex-direction:column;gap:4px}
.is-b b{font-size:18px;font-weight:500;line-height:1.35}
.is-b span{font-size:14.5px;line-height:1.6;color:#b5c7d6;font-weight:300;max-height:0;overflow:hidden;opacity:0;visibility:hidden;transition:max-height .5s ease,opacity .4s,visibility .5s}
.istep.on .is-b span{max-height:140px;opacity:1;visibility:visible}
.imp-v{position:relative;aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.iv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .7s ease,transform 1.6s cubic-bezier(.2,.7,.2,1)}
.iv.on{opacity:1;transform:scale(1)}
.iv-bar{position:absolute;left:20px;right:20px;bottom:16px;display:flex;gap:6px}
.iv-bar i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .4s}
.iv-bar i.on{background:#7cc4f0}
@media (min-width:1081px){
  .imp-s{height:280vh}
  .imp-pin{position:sticky;top:74px;height:calc(100vh - 74px);display:flex;align-items:center;padding:0}
  .imp-pin>.wrap{width:100%}
}
/* comparison */
.cmp-s{background:var(--navy-d);color:#fff;padding:24px 0 104px}
.cmp-s h2{color:#fff}
.cmp-s .sec-h p{color:#b5c7d6}
.vsc{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1000px;margin:0 auto}
.vc{border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03)}
.vc.me{border-color:rgba(124,196,240,.55);background:rgba(58,154,217,.08)}
.vc-img{aspect-ratio:16/10;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vc.me .vc-img{background:radial-gradient(70% 70% at 50% 50%,#1d5585,var(--navy))}
.vc-img img{width:100%;height:100%;object-fit:cover}
.vc.me .vc-img img{object-fit:contain;padding:6% 8%}
.vc-b{padding:24px 26px 28px}
.vc h3{color:#fff;font-size:20px;font-weight:500}
.vc-l{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.vc-l li{position:relative;padding-left:28px;font-size:15px;color:#cfe0ee;font-weight:300;line-height:1.5}
.vc-l li::before{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.vc-l.no li::before{content:"✕";background:rgba(255,255,255,.1);color:#9fb0c0}
.vc-l.yes li::before{content:"✓";background:var(--blue);color:#fff}
@media (max-width:1080px){.imp-g{grid-template-columns:1fr;gap:32px}.imp-v{order:-1}}
@media (max-width:720px){
  .imp-pin{padding:64px 0}
  .imp-t h2{font-size:29px}
  .imp-v{margin:0 -18px;border-radius:0}
  .istep{padding:14px}
  .is-b b{font-size:16.5px}
  .cmp-s{padding:8px 0 72px}
  .vsc{grid-template-columns:1fr}
}
/* hero jaw frames */
.hj{position:relative;width:100%;max-width:640px;margin:0 auto;--mx:0;--my:0}
.hj-in{position:relative;aspect-ratio:3/2;transform:perspective(1100px) rotateY(calc(var(--mx)*6deg)) rotateX(calc(var(--my)*-4deg));transition:transform .5s cubic-bezier(.2,.7,.2,1);animation:float 6s ease-in-out infinite;-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 55%,transparent 100%)}
.hjf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(.96);transition:opacity 1s ease,transform 3s cubic-bezier(.2,.7,.2,1);pointer-events:none;user-select:none}
.hjf.on{opacity:1;transform:scale(1.02)}
.hj-cap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:13px;color:#cfe0ee}
.hj-cap b{font-weight:400;margin-left:8px;min-width:230px}
.hj-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .4s,width .4s}
.hj-dot.on{background:#7cc4f0;width:22px;border-radius:4px}
@media (max-width:720px){.hj-cap b{min-width:0;font-size:12px}}
/* image logo */
.logo img{display:block;height:40px;width:auto}
.logo .lg-w{display:none}
.ftr .logo .lg-d{display:none}
.ftr .logo .lg-w{display:block;height:46px}
@media (max-width:720px){.logo img{height:34px}}
.about-one{max-width:900px}
.about-one .split-t{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.about-one .split-t>.pill,.about-one .split-t>h2{grid-column:1/-1}
.about-one .split-t>.pill{justify-self:start}
.about-one .vs{grid-column:1/-1}
@media (max-width:860px){.about-one .split-t{grid-template-columns:1fr}}
/* hero jaw: larger, shifted right */
@media (min-width:1081px){
  .hero-in{grid-template-columns:1fr 1fr}
  .hj{max-width:none;width:128%;margin:0 0 0 2%}
}
@media (min-width:1500px){.hj{width:135%}}
@media (max-width:1080px){.hj{max-width:760px;width:112%;margin-left:-2%}}
@media (max-width:720px){.hj{width:118%;margin-left:-6%}}
@media (min-width:1081px) and (max-width:1340px){.hj{width:114%;margin-left:0}}
/* pf-gap */html body .pf-by.pf-by.pf-by{margin-left:-1.5px!important;gap:7px!important}
/* kpis: равные колонки */
.kpis.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 48px;max-width:520px}
.kpis.kpis>div{max-width:none;padding:2px 0;border:0;position:relative}
.kpis.kpis>div+div::before{content:"";position:absolute;left:-24px;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,.18)}
@media (max-width:600px){.kpis.kpis{max-width:none;column-gap:28px}.kpis.kpis>div+div::before{left:-14px}}
</style>

/* hero jaw: cross-fading 3D frames + mouse tilt */
const HJ = $('#hj');
(() => {
  const h = $('.hero'); let raf = 0, tx = 0, ty = 0;
  h.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const r = h.getBoundingClientRect(); tx = (e.clientX - r.left) / r.width * 2 - 1; ty = (e.clientY - r.top) / r.height * 2 - 1;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; HJ.style.setProperty('--mx', tx.toFixed(3)); HJ.style.setProperty('--my', ty.toFixed(3)); }); });
  h.addEventListener('pointerleave', () => { HJ.style.setProperty('--mx', 0); HJ.style.setProperty('--my', 0); });
})();

function closeModal() { const m = $('#modal'); m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); document.body.classList.remove('lock'); }

function setMenu(o) { const s = $('#sheet'); s.classList.toggle('open', o); s.setAttribute('aria-hidden', String(!o)); document.body.classList.toggle('lock', o || $('#modal').classList.contains('open')); }

function setCur(c) {

function scrollToId(id) { const el = document.getElementById(id); if (!el) return; const y = el.getBoundingClientRect().top + window.scrollY - ($('#hdr').offsetHeight + 8); window.scrollTo({ top: id === 'top' ? 0 : y, behavior: 'smooth' }); }

document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scroll]');
  if (sc) { e.preventDefault(); setMenu(false); scrollToId(sc.dataset.scroll); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (e.target.closest('a[href="#"]')) e.preventDefault(); if (!e.target.closest('#fab')) setFab(false); return; }
  if (a.tagName === 'A') e.preventDefault();
  const act = a.dataset.act;
  if (act !== 'fab' && !a.closest('#fab')) setFab(false);
  switch (act) {
    case 'book': openModal(); break;
    case 'close': closeModal(); break;
    case 'menu': setMenu(true); break;
    case 'menu-close': setMenu(false); break;
    case 'fab': setFab(!$('#fab').classList.contains('open')); break;
    case 'wa': setFab(false); closePop(); toast('Opening WhatsApp chat with ' + CO.wa + '…'); break;
    case 'soc': toast('Follow us @lotusarcdental'); break;
    case 'soon': toast('This treatment page is being updated — ask our coordinator for details.'); break;
    case 'legal': toast('Our privacy policy is available on request from ' + CO.email); break;
    case 'pop-close': closePop(); break;
    case 'cur': setCur(a.dataset.v); break;
    case 'day': {
      const i = +a.dataset.v; $$('.days-t button').forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-selected', String(k === i)); });
      const p = $('#day-p'); p.classList.remove('sw'); void p.offsetWidth; p.innerHTML = dayPanel(i); p.classList.add('sw'); break;
    }
    case 'istep': {
      const i = +a.dataset.v;
      if (wide()) { const r = IMP.getBoundingClientRect(), span = r.height - innerHeight; window.scrollTo({ top: scrollY + r.top + span * (i + 0.5) / 3, behavior: 'smooth' }); }
      else { iHold = Date.now() + 9000; setIStep(i); }
      break;
    }
    case 'm-open': if (M) { const on = M.toggleOpen(); a.setAttribute('aria-pressed', String(on)); a.querySelector('span').textContent = on ? 'Fit the bridge' : 'Show implants'; } break;
    case 'm-xray': if (M) { const on = M.toggleXray(); a.setAttribute('aria-pressed', String(on)); } break;
    case 'm-replay': if (M) { M.replay(); const b = $('[data-act="m-open"]'); b.setAttribute('aria-pressed', 'false'); b.querySelector('span').textContent = 'Show implants'; } break;
    case 'm-opt': Q[QS[Q.step].k] = a.dataset.v; Q.step++; rerenderModal(); break;
    case 'm-next': Q.step++; rerenderModal(); break;
    case 'm-back': Q.err = ''; Q.step = Math.max(0, Q.step - 1); rerenderModal(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'm-file') { const f = e.target.files && e.target.files[0]; if (f) { Q.file = f.name; rerenderModal(); } }
});
document.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.form !== 'm-contact') return; e.preventDefault();
  Q.name = f.name.value.trim(); Q.email = f.email.value.trim(); Q.phone = f.phone.value.trim(); Q.country = f.country.value;
  if (Q.name.length < 2) Q.err = 'Please enter your name.';
  else if (!/^\S+@\S+\.\S+$/.test(Q.email)) Q.err = 'Please enter a valid email address.';
  else if (Q.phone.replace(/\D/g, '').length < 8) Q.err = 'Please enter your mobile number.';
  else { Q.err = ''; Q.done = true; }
  rerenderModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); setMenu(false); closePop(); setFab(false); } });

/* before / after */
(function () {
  const ba = $('#ba'), r = $('.ba-range', ba);
  const set = v => { ba.style.setProperty('--pos', v + '%'); r.value = v; };
  r.addEventListener('input', () => set(r.value));
  let drag = false;
  const move = e => { const b = ba.getBoundingClientRect(); set(Math.max(0, Math.min(100, (e.clientX - b.left) / b.width * 100)).toFixed(1)); };
  ba.addEventListener('pointerdown', e => { drag = true; ba.setPointerCapture(e.pointerId); move(e); });
  ba.addEventListener('pointermove', e => drag && move(e));
  ba.addEventListener('pointerup', () => drag = false); ba.addEventListener('pointercancel', () => drag = false);
})();

/* reveal + counters */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
$$('[data-r]').forEach(el => io.observe(el));
function countUp(el) {
  const to = +el.dataset.count, dur = 1400, t0 = performance.now();
  const f = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(f); };
  reduce ? (el.textContent = to) : requestAnimationFrame(f);
}
setTimeout(() => $$('[data-count]').forEach(countUp), 500);


/* implant story: scroll-driven on desktop, autoplay on smaller screens */
let iStep = 0, iHold = 0;
function setIStep(i) {
  if (i === iStep) return; iStep = i;
  $$('.iv').forEach((im, k) => im.classList.toggle('on', k === i));
  $$('.istep').forEach((b, k) => b.classList.toggle('on', k === i));
  $$('.iv-bar i').forEach((b, k) => b.classList.toggle('on', k <= i));
}
const IMP = $('#how'), wide = () => innerWidth > 1080;
function impScroll() {
  if (!wide()) return;
  const r = IMP.getBoundingClientRect(), span = r.height - innerHeight;
  const p = Math.max(0, Math.min(0.999, -r.top / Math.max(1, span)));
  IMP.style.setProperty('--ip', p.toFixed(3)); setIStep(Math.floor(p * 3));
}
window.addEventListener('scroll', impScroll, { passive: true });
let impVis = false;
new IntersectionObserver(es => { impVis = es[0].isIntersecting; }, { threshold: 0.35 }).observe(IMP);
setInterval(() => { if (wide() || !impVis || Date.now() < iHold) return; setIStep((iStep + 1) % 3); }, 3200);

/* scroll effects */
function onScroll() {
  const y = window.scrollY;
  document.body.classList.toggle('scrolled', y > 40);
  document.body.classList.toggle('past-hero', y > window.innerHeight * 0.7);
  const jr = $('#jr');
  if (jr) { const r = jr.getBoundingClientRect(), vh = window.innerHeight; const k = Math.max(0, Math.min(1, (vh * 0.75 - r.top) / (r.height))); jr.style.setProperty('--p', k.toFixed(3)); }
  const doc = document.documentElement; if (!popShown && y / (doc.scrollHeight - window.innerHeight) > 0.62) openPop();
}
window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
window.addEventListener('resize', () => { if (innerWidth > 1080) setMenu(false); });
</script>
