<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vettra — Hiring Desk</title>
<meta name="description" content="A dark hiring dashboard: time to hire, open roles, a candidate pipeline, interview scorecards and team settings.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="app" id="app">
    <aside class="side">
      <div class="brand"><span class="mk"><svg viewBox="0 0 24 24"><path d="M5 5l7 14 7-14"/></svg></span><div><b>Vettra</b><small>Hiring desk · Northwind</small></div><button class="ib sm" aria-label="Collapse"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M10 5v14"/></svg></button></div>
      <div class="ssearch"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><span>Search people, roles…</span><kbd>⌘K</kbd></div>
      <nav class="nav" id="nav"><span class="hl" id="hl"></span></nav>
      <div class="me"><span class="av">DR</span><div><b>Daniel Reyes</b><small>Head of Talent</small></div></div>
    </aside>
    <section class="main">
      <header class="top">
        <div class="crumbs" id="crumbs"></div>
        <div class="r">
          <span class="clock"><i></i><b id="clock">10:24 AM</b><em>Thursday</em></span>
          <button class="ib" id="soundB" aria-label="Mute sounds"></button>
          <button class="ib" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/></svg><em>3</em></button>
          <button class="btn light" data-act="new"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
        </div>
      </header>
      <main class="view" id="view"></main>
      <aside class="drawer" id="drawer"></aside>
      <div class="toast" id="toast"><span class="ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><span id="toastT"></span><button id="undo">Undo</button></div>
    </section>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script src="vendor/Flip.min.js"></script>
<script src="sounds.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
