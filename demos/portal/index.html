<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F4F5F7; --surface-3:#ECEEF1; --field:#F3F4F6;
  --line:#E7E9ED; --line-2:#F0F1F4; --line-3:#D5D9E0;
  --ink:#16181C; --ink-2:#4A505C; --ink-3:#8A909B;
  --brand:#1A56DB; --brand-2:#1442B0; --brand-soft:#E8EFFD;
  --ok:#2E8B57; --ok-soft:#E6F4EC; --warn:#A86A00; --warn-soft:#FBF1DC; --bad:#C62D1F; --bad-soft:#FCE9E7; --info:#0E7490; --info-soft:#E1F2F6;
  --r:24px; --r-md:16px; --r-sm:12px; --r-xs:8px;
  --shadow-lg:0 24px 60px -16px rgba(22,24,28,.28);
  --font:"Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --wrap:1280px;
  --c-gas:#1A56DB; --c-el:#D19A00; --c-rad:#0E7490; --c-pump:#12907F; --c-boil:#7451C2; --c-tank:#56677A; --c-fit:#3D9142; --c-auto:#C33B7E;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.m-only{display:none!important}
.wrapx{max-width:var(--wrap);margin:0 auto;padding:0 32px;width:100%}


.hdr{background:var(--surface);position:sticky;top:0;z-index:40}
.hdr-top{border-bottom:1px solid var(--line)}
.hdr-top .wrapx{display:flex;align-items:stretch;gap:28px;height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:30px;height:30px}
.brand .wm{font-weight:800;font-size:20px;letter-spacing:.08em;line-height:1}
.brand .wm small{display:block;font-size:9.5px;letter-spacing:.32em;font-weight:600;color:var(--ink-3);margin-top:3px}
.tabs-top{display:flex;align-items:stretch;gap:4px;margin-left:16px}
.tabs-top a{display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);position:relative}
.tabs-top a:hover{color:var(--ink)}
.tabs-top a.on{color:var(--ink)}
.tabs-top a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brand);border-radius:3px 3px 0 0}
.util{display:flex;align-items:center;gap:22px;margin-left:auto;font-size:14px;color:var(--ink-2)}
.util a,.util button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;color:inherit;white-space:nowrap}
.util a:hover,.util button:hover{color:var(--ink)}
.util svg{width:18px;height:18px;color:var(--ink-3)}
.util select{border:0;background:transparent;color:var(--ink-2);font-size:14px;padding:0;cursor:pointer;outline:none}
.hdr-main .wrapx{display:flex;align-items:center;gap:8px;height:76px}
.mainnav{display:flex;align-items:center;gap:4px;min-width:0}
.mainnav>a,.mainnav>.more>button{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink);border:0;background:transparent;white-space:nowrap}
.mainnav>a:hover,.mainnav>.more>button:hover{background:var(--surface-2)}
.mainnav>a.on{color:var(--brand-2);background:var(--brand-soft)}

.bar{height:6px;border-radius:3px;background:var(--surface-3);position:relative}

}
function header(cur){
  const mgr = S.mode==='mgr';
  const items = navItems();
  const main = items.filter(n=>!n.more && !n.mobileOnly);
  const more = items.filter(n=>n.more);
  const moreOn = more.some(n=>n.id===cur);
  const total = S.carts.reduce((s,c)=>s+cartSum(c),0); const cnt = S.carts.reduce((s,c)=>s+c.items.length,0);
  const user = mgr ? {n:'Laura Bennett', r:'KAM'} : {n:S.role==='Director'?'James Whitfield':S.role==='Buyer'?'Emma Clarke':S.role==='Accountant'?'Sarah Hughes':'Daniel Price', r:S.role};
  const ini = user.n.split(' ').map(x=>x[0]).join('');

  const util = mgr

    : `<label class="u-opt" title="View as another role">${ic('users')}<select data-in="role" aria-label="Role">${Object.keys(ROLE_ACCESS).map(r=>`<option ${r===S.role?'selected':''}>${r}</option>`).join('')}</select></label><a href="#" data-act="help">${ic('info')} Help</a><a href="#" data-act="whs">${ic('pin')} Warehouses</a><a href="#" data-act="kam">${ic('phone')} Account manager: ${DEALER.kam.name}</a>`;
  return `<header class="hdr">
    <div class="hdr-top"><div class="wrapx">${BRAND(mgr?'FACTORY':'PARTNER')}
      <nav class="tabs-top"><a href="#/" class="${mgr?'':'on'}" data-act="to-dealer">For dealers</a><a href="#/m" class="${mgr?'on':''}" data-act="to-mgr">Manufacturer console</a></nav>
      <div class="util">${util}</div></div></div>
    <div class="hdr-main"><div class="wrapx">
      <span class="m-only">${BRAND(mgr?'FACTORY':'PARTNER')}</span>
      <nav class="mainnav">${main.map(n=>`<a href="#/${n.id}" class="${cur===n.id?'on':''}">${n3d(n)}${n.t}${n.tag?`<span class="ai">${n.tag}</span>`:''}${badge(n)}</a>`).join('')}
        ${more.length?`<div class="more"><button data-act="more" class="${moreOn?'on':''}" style="${moreOn?'color:var(--brand-2);background:var(--brand-soft)':''}">More<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="more-pop">${more.map(n=>`<a href="#/${n.id}" class="${cur===n.id?'on':''}">${n3d(n)}${n.t}${badge(n)}</a>`).join('')}</div></div>`:''}
      </nav>
      <button class="hdr-search" data-act="search" aria-label="Search">${ic('search')}<span>${mgr?'Search dealers, orders or cities…':'Search SKU, product or competitor model…'}</span><kbd>/</kbd></button>
      <div class="hdr-actions">
        <button class="icon-btn hs-ico" data-act="search" aria-label="Search">${ic('search')}</button>
        <button class="icon-btn" data-act="notifs" aria-label="Notifications">${ic('bell')}${S.unread?`<span class="dot">${S.unread}</span>`:''}</button>
        ${!mgr && canBuy() ? `<button class="cart-btn" data-act="go" data-to="cart" aria-label="Baskets">${ic('cart')}<span class="lbl">Basket</span><span class="sum">${cnt?fmt(total):''}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`:''}
        <button class="me-btn" data-act="go" data-to="${mgr?'m/dealers':'company'}" title="${esc(user.n)} · ${esc(user.r)}"><span class="av">${ini}</span><span class="nm">${esc(user.n.split(' ')[0])}</span></button>
        <button class="icon-btn burger" data-act="burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div></div></div>
    <div class="search-row ${S.searchOpen?'open':''}"><div class="wrapx"><div class="search">${ic('search')}<input id="gsearch" placeholder="${mgr?'Search dealer, city, company number':'SKU, name or competitor model'}" autocomplete="off"><div class="search-res" id="gres"></div></div></div></div>
  </header>`;
}
function sheet(cur){
  const mgr=S.mode==='mgr'; const items=navItems();
  const link = n => { const b=n.badge?n.badge():0; return `<a class="nl ${cur===n.id?'on':''}" href="#/${n.id}">${n3d(n)}${n.t}${b?`<span class="badge">${b}</span>`:''}</a>`; };
  return `<div class="sheet"><div class="sheet-back" data-act="burger"></div><div class="sheet-panel">
    <div class="between" style="padding:4px 4px 8px">${BRAND(mgr?'FACTORY':'PARTNER')}<button class="icon-btn" data-act="burger" aria-label="Close">${ic('x')}</button></div>
    <div class="seg seg-full" style="grid-template-columns:1fr 1fr"><button class="${mgr?'':'on'}" data-act="to-dealer">For dealers</button><button class="${mgr?'on':''}" data-act="to-mgr">Manufacturer console</button></div>
    ${mgr?'':`<div class="field mt12" style="margin-bottom:4px"><label>Role</label><select class="sel" data-in="role">${Object.keys(ROLE_ACCESS).map(r=>`<option ${r===S.role?'selected':''}>${r}</option>`).join('')}</select></div>`}
    <div class="sh-group">${mgr?'Manufacturer console':'Sections'}</div>
    ${items.filter(n=>!n.more).map(link).join('')}
    ${items.some(n=>n.more)?`<div class="sh-group">Service & settings</div>${items.filter(n=>n.more).map(link).join('')}`:''}
    ${mgr?'':`<div class="sh-group">Your account manager</div><div style="padding:4px 10px" class="small"><b>${DEALER.kam.name}</b><div class="muted">${DEALER.kam.phone}</div></div>`}
  </div></div>`;
}
function render(){
  const {parts,q} = route();
  let key = parts.join('/');
  if(key==='m' || key.startsWith('m/')) S.mode='mgr'; else if(S.mode==='mgr') S.mode='dealer';
  let view, cur = parts[0]||'';
  try{
    if(S.mode==='mgr'){ cur = parts.length>1 ? 'm/'+parts[1] : 'm'; view = mgrView(parts, q); }
    else {
      const acc = ROLE_ACCESS[S.role];
      if(acc && !acc.includes(cur) && !['order','cart','product'].includes(cur)) view = noAccess();
      else view = dealerView(parts, q);
      if(cur==='order') cur='orders';
    }
  }catch(e){ console.error(e); view = `<div class="card card-b">Render error: ${esc(e.message)}</div>`; }
  const strip = S.mode==='mgr' ? `<div class="mode-strip"><div class="wrapx">${ic('shield')}<span>Manufacturer console · South West region · dealers cannot see this section</span></div></div>`
    : S.imp ? `<div class="imp-strip"><div class="wrapx">${ic('alert')}<span style="flex:1 1 220px">You are signed in as <b>${DEALER.name}</b> (account manager Laura Bennett). The sign-in is logged.</span><button class="btn sm" data-act="imp-exit">Back to manufacturer console</button></div></div>` : '';
  document.getElementById('root').innerHTML = `${header(cur)}${strip}<main class="content">${view}</main>${sheet(cur)}`;
  labelTables(document.getElementById('root'));
  window.scrollTo(0,0);
  afterRender?.();
}
let afterRender = null;
function labelTables(root){
  root.querySelectorAll('table.tbl').forEach(t=>{
    const heads=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      const tds=[...tr.children];
      if(tds.some(td=>td.colSpan>1)) tr.classList.add('tot');
      tds.forEach((td,i)=>{ if(!td.hasAttribute('data-l')) td.setAttribute('data-l', heads[i]||''); });
      if(t.classList.contains('lastfull') && tds.length) tds[tds.length-1].classList.add('full');
    });
  });
}
const pageHead = (title, sub='', actions='', crumbs='') => `<div class="ph"><div>${crumbs?`<div class="crumbs">${crumbs}</div>`:''}<h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${actions?`<div class="row wrap">${actions}</div>`:''}</div>`;
const noAccess = () => `<div class="card"><div class="empty">${ic('shield')}<div class="b" style="color:var(--ink)">Section not available for the role “${esc(S.role)}”</div><div class="mt8">Permissions are set by the company director under “Company”.</div></div></div>`;

// ===== Dealer screens =====
function dealerView(parts, q){
  const p = parts[0]||'';
  switch(p){
    case '': return vHome();
    case 'catalog': return vCatalog(q);
    case 'quick': return vQuick(q);
    case 'cart': return vCart();
    case 'orders': return vOrders();
    case 'order': return vOrder(parts[1]);
    case 'projects': return vProjects();
    case 'finance': return vFinance();
    case 'docs': return vDocs();
    case 'claims': return vClaims();
    case 'marketing': return vMarketing();
    case 'academy': return vAcademy();
    case 'program': return vProgram();
    case 'company': return vCompany();
    default: return `<div class="card"><div class="empty">Page not found</div></div>`;
  }
}

function limitBlock(extra=0, dark=false){
  const f = fin(); const L=f.limit; const cD=dark?'#F4EFE9':'#3A3935', cR=dark?'rgba(255,255,255,.42)':'#A9A69C';
  const w = v => Math.max(0, v/L*100).toFixed(2)+'%';
  const over = extra > f.free;
  return `<div class="limit-bar"><span style="width:${w(f.debt)};background:${cD}"></span><span style="width:${w(f.reserved)};background:${cR}"></span>${extra?`<span style="width:${w(Math.min(extra,Math.max(f.free,0)))};background:${over?'var(--bad)':'var(--brand)'}"></span>`:''}</div>
  <div class="legend"><span><i style="background:${cD}"></i>Balance ${fmt(f.debt)}</span><span><i style="background:${cR}"></i>Reserved ${fmt(f.reserved)}</span>${extra?`<span><i style="background:${over?'var(--bad)':'var(--brand)'}"></i>This order ${fmt(extra)}</span>`:''}<span><i style="background:${dark?'rgba(255,255,255,.12)':'var(--surface-3)'};box-shadow:inset 0 0 0 1px ${dark?'rgba(255,255,255,.25)':'var(--line-3)'}"></i>Available ${fmt(Math.max(f.free-extra,0))}</span></div>`;
}
function planInfo(){
  const pl = DEALER.plan; const p = pl.fact/pl.target;
  const steps=[[0.9,1],[1,2],[1.1,3]]; const cur = steps.filter(s=>p>=s[0]).pop(); const next = steps.find(s=>p<s[0]);
  return {p, curB:cur?cur[1]:0, next, need: next? pl.target*next[0]-pl.fact : 0};
}

function parseSku(text){
  return text.split(/\n/).map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m=line.split(/[\s;,\t]+/); const sku=m[0].toUpperCase(); const orig=parseInt(m[1]||'1',10)||1; const p=bySku(sku);
    const qty = p?roundPack(orig,p.pack):orig;
    return {i,line,sku,p,orig,qty,rounded:p&&qty!==orig};
  });
}

function doCheckout(){
  const c=curCart(); if(!c.items.length) return;
  const f=fin(); const co=S.checkout; const sum=cartTotals(c).total;
  const over = sum - f.free > 0; const thr = S.role==='Buyer' && sum>25000;
  const id='Z-26-0'+(S.seqOrder++);
  let status='Reserved';
  if(over && co.limitOpt==='request') status='Pending approval';
  if(over && co.limitOpt==='prepay') status='Invoiced';
  if(thr) status='Pending approval';
  const o={id, date:TODAY, status, reserveTill:'2026-11-12', who:S.role==='Director'?'James Whitfield':'Emma Clarke', wh:c.wh, cart:c.name, items:c.items.map(i=>[...i]), delivery: co.delivery==='tk'?'Palletways':co.delivery==='factory'?'Kalderra truck':'Collection', fresh:true};
  if(over && co.limitOpt==='split'){ o.note='Split into two shipments: the second after invoice No. 7719 is paid'; }
  S.orders.unshift(o);
  if(status==='Pending approval' && !thr){ S.queue.unshift({id:'q'+id, type:'Credit limit increase', dealer:DEALER.name, what:'', ask:'', risk:'Low: no late payments in 12 months', due:'by 15:10', order:id}); }
  S.notifs.unshift({t:`Order ${id} ${status==='Reserved'?'confirmed and reserved until 12 Nov':status==='Pending approval'?'sent for approval':'awaiting prepayment'}`, d:'just now', k:status==='Reserved'?'ok':'warn'});
  S.unread++;
  c.items=[];
  toast(status==='Reserved'?`Order <b>${id}</b> accepted by SAP and reserved for 5 working days. The invoice will arrive by e-invoice.`:status==='Pending approval'?`Order <b>${id}</b> sent for approval. Reply within 4 working hours.`:`Order <b>${id}</b> created, prepayment invoice issued.`, status==='Reserved'?'ok':'warn');
  go('order/'+id);
}

function qrFake(){ let s=''; let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280; return seed/233280;}; for(let y=0;y<29;y++)for(let x=0;x<29;x++){ const fin=(x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21); let on; if(fin){ const cx=x>21?x-22:x, cy=y>21?y-22:y; on = cx===0||cx===6||cy===0||cy===6||(cx>=2&&cx<=4&&cy>=2&&cy<=4); } else on = rnd()>0.52; if(on) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#14181F"/>`; } return s; }

// ===== Kalderra AI — assistant for dealers (demo) =====
(function(){
  const css = `
  .kai-fab{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 8px;border:0;border-radius:18px;background:#1A56DB;color:#fff;font:600 15px/1 inherit;font-family:inherit;box-shadow:0 14px 30px -10px rgba(26,86,219,.6);cursor:pointer;transition:transform .16s ease}
  .kai-fab:active{transform:scale(.97)}
  .kai-fab .kai-av{width:40px;height:40px}
  .kai-av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#4F80F0,#1A56DB 60%,#123FA8);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .kai-fab .kai-av{border-radius:12px;background:rgba(255,255,255,.16);box-shadow:none;overflow:hidden}
  .kai-av svg{width:58%;height:58%}
  .kai{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(420px,100%);display:flex;flex-direction:column;background:#fff;box-shadow:-20px 0 60px -20px rgba(15,23,42,.35);transform:translateX(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);font-family:inherit}

  .kai-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #E5E9F0}

  .kai-x{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid #E5E9F0;background:#fff;display:grid;place-items:center;cursor:pointer}
  .kai-x svg{width:18px;height:18px;stroke:#0F172A;fill:none;stroke-width:2;stroke-linecap:round}

  .kai-row:last-of-type{border-bottom:0}
  .kai-row span{color:#64748B}
  .kai-row b{font-weight:600;text-align:right;white-space:nowrap}
  .kai-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .kai-btn{min-height:38px;padding:0 14px;border-radius:10px;border:1px solid #1A56DB;background:#1A56DB;color:#fff;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
  .kai-btn.ghost{background:#fff;color:#1A56DB}
  .kai-chips{display:flex;flex-wrap:wrap;gap:8px}
  .kai-chip{padding:8px 12px;border-radius:999px;border:1px solid #C9D6F5;background:#fff;color:#1A56DB;font:500 13.5px inherit;font-family:inherit;cursor:pointer;text-align:left}
  .kai-dots{display:inline-flex;gap:4px}.kai-dots i{width:6px;height:6px;border-radius:50%;background:#94A3B8;animation:kaid 1s infinite}.kai-dots i:nth-child(2){animation-delay:.15s}.kai-dots i:nth-child(3){animation-delay:.3s}
  @keyframes kaid{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .kai-f{display:flex;gap:8px;padding:12px;border-top:1px solid #E5E9F0;background:#fff}
  .kai-f textarea{flex:1;min-height:46px;max-height:120px;resize:none;padding:12px 14px;border-radius:12px;border:1px solid #D5DCE6;font:16px/1.35 inherit;font-family:inherit;color:#0F172A}
  .kai-f textarea:focus{outline:2px solid #1A56DB;outline-offset:-1px;border-color:transparent}
  .kai-f button{width:46px;height:46px;flex:none;border-radius:12px;border:0;background:#1A56DB;display:grid;place-items:center;cursor:pointer}
  .kai-f button svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kai-note{font-size:11.5px;color:#94A3B8;text-align:center;padding:0 12px 10px;background:#fff}
  @media (max-width:720px){.kai-fab{right:14px;bottom:14px;width:60px;height:60px;padding:0;justify-content:center;border-radius:18px;background:transparent;box-shadow:none;filter:drop-shadow(0 10px 14px rgba(26,86,219,.35))}.kai-fab span:not(.kai-av){display:none}.kai-fab .kai-av{width:60px;height:60px;border-radius:18px;overflow:hidden}.kai-fab .kai-av img{transform:scale(1.14)}.kai{width:100%}}
  @media (prefers-reduced-motion:reduce){.kai{transition:none}.kai-dots i{animation:none}}`;
  const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
  const SPARK='<svg viewBox="0 0 24 24"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z" fill="#fff"/><path d="M19 15.5c.25 1.9 1.1 2.75 3 3-1.9.25-2.75 1.1-3 3-.25-1.9-1.1-2.75-3-3 1.9-.25 2.75-1.1 3-3z" fill="#fff" opacity=".75"/></svg>';
  const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  document.body.insertAdjacentHTML('beforeend',`
    <button class="kai-fab" id="kaiFab" aria-label="Open Kalderra AI assistant"><span class="kai-av"><img src="img/ai-avatar.webp" alt=""></span><span>Ask Kalderra AI</span></button>
    <aside class="kai" id="kai" aria-label="Kalderra AI assistant" aria-hidden="true">
      <div class="kai-h"><span class="kai-av img"><img src="img/ai-avatar.webp" alt=""></span><div><b>Kalderra AI</b><small>Assistant for ${E(DEALER.name)}</small></div><button class="kai-x" id="kaiX" aria-label="Close assistant"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="kai-b" id="kaiB" aria-live="polite"></div>
      <form class="kai-f" id="kaiF"><textarea id="kaiIn" rows="1" placeholder="Ask about stock, prices, orders…" aria-label="Message"></textarea><button aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
      <div class="kai-note">Demo assistant · answers from this portal's catalogue and orders</div>
    </aside>`);
  const box=document.getElementById('kai'), body=document.getElementById('kaiB'), inp=document.getElementById('kaiIn');
  const add=(html,cls='kai-m')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;body.appendChild(d);body.scrollTop=body.scrollHeight;return d;};
  const say=t=>add(E(t));
  const CHIPS=[['ai-stock-check','Is KD-G24 in stock in Manchester?'],['ai-auto-order','Build an order: 10 x KR-500-10, 4 x KD-G24, 6 x KP-25-60'],['ai-reorder','Repeat my last delivered order'],['ai-chat','Where is order Z-26-04471?'],['ai-spec-scan','What is your equivalent of Baxi 600 Combi 24?']];
  const chips=()=>add(`<div class="kai-chips">${CHIPS.map(([im,c])=>`<button class="kai-chip" type="button"><img src="img/${im}.webp" alt=""><span>${E(c)}</span></button>`).join('')}</div>`,'kai-card');
  let started=false;
  function open(){ box.classList.add('on'); box.setAttribute('aria-hidden','false'); if(!started){started=true; say(`Hi ${USERS[0].name.split(' ')[0]}! I can check stock and your prices, build an order from a list, repeat a past order or track a delivery.`); chips();} setTimeout(()=>inp.focus(),300); }
  function close(){ box.classList.remove('on'); box.setAttribute('aria-hidden','true'); }
  document.getElementById('kaiFab').onclick=open; document.getElementById('kaiX').onclick=close;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&box.classList.contains('on')) close(); });
  const refresh=()=>{const y=scrollY; render(); scrollTo(0,y);};
  const prodCard=p=>`<b>${E(p.name)}</b> <span style="color:#64748B">${E(p.sku)}</span>
    <div class="kai-row"><span>Your price</span><b>${fmt(p.price)}${p.promo?' · deal':''}</b></div>
    ${Object.entries(WH).map(([k,n])=>`<div class="kai-row"><span>${n}</span><b>${p.stock[k]>0?p.stock[k]+' in stock':'out of stock'}</b></div>`).join('')}
    ${p.incoming?`<div class="kai-row"><span>Incoming</span><b>${p.incoming[1]} pcs on ${fdate(p.incoming[0])}</b></div>`:''}
    <div class="kai-btns"><button class="kai-btn" type="button" data-kadd="${E(p.sku)}:1">Add 1 to basket</button><button class="kai-btn ghost" type="button" data-kgo="product/${E(p.sku)}">Open product</button></div>`;
  const findSkus=t=>{const out=[];const re=/\b(K[A-Z]-[A-Z0-9]+(?:-[A-Z0-9]+)*)\b/gi;let m;while((m=re.exec(t))){const p=bySku(m[1].toUpperCase());if(p&&!out.includes(p))out.push(p);}return out;};
  function answer(t){
    const low=t.toLowerCase();
    // competitor equivalents
    const an=Object.keys(ANALOGS).find(k=>low.includes(k.toLowerCase()));
    if(an){const p=bySku(ANALOGS[an]); say(`Our equivalent of ${an} is ${p.name} (${p.sku}).`); add(prodCard(p),'kai-card'); return;}
    // order tracking
    const oid=(t.match(/Z-\d{2}-\d{5}/i)||[])[0];
    if(oid||/where is|track|status|deliver/.test(low)&&/order/.test(low)&&!/repeat|reorder|again/.test(low)){
      const list=oid?S.orders.filter(o=>o.id.toUpperCase()===oid.toUpperCase()):S.orders.filter(o=>!['Delivered','Cancelled','Declined'].includes(o.status)).slice(0,4);
      if(!list.length){say(`I couldn't find order ${oid}. Check the number in Orders.`);return;}
      say(oid?'Here is that order:':'Your open orders:');
      add(list.map(o=>`<div class="kai-row"><span>${E(o.id)} · ${fdate(o.date)}</span><b>${E(o.status)}</b></div>${o.track?`<div class="kai-row"><span>Tracking</span><b>${E(o.track)}</b></div>`:''}`).join('')+`<div class="kai-btns"><button class="kai-btn ghost" type="button" data-kgo="${oid?'order/'+E(list[0].id):'orders'}">${oid?'Open order':'All orders'}</button></div>`,'kai-card'); return;}
    // repeat last order
    if(/repeat|reorder|again|same as last/.test(low)){
      const o=S.orders.find(o=>o.status==='Delivered')||S.orders.find(o=>o.status==='Shipped')||S.orders[0];
      o.items.forEach(([s,q])=>addToCart(s,q,'c1')); refresh();
      say(`Done — I added the ${o.items.length} lines from ${o.id} to your Main basket.`);
      add(o.items.map(([s,q])=>{const p=bySku(s);return `<div class="kai-row"><span>${E(p?p.name:s)}</span><b>${q} pcs</b></div>`;}).join('')+`<div class="kai-btns"><button class="kai-btn" type="button" data-kgo="cart">Open basket</button></div>`,'kai-card'); return;}
    // build order from a list: "10 x SKU" / "SKU x 10"
    const pairs=[];const re=/(\d+)\s*(?:x|×|pcs|pc)?\s*(K[A-Z]-[A-Z0-9-]+)|(K[A-Z]-[A-Z0-9-]+)\s*(?:x|×)\s*(\d+)/gi;let m;
    while((m=re.exec(t))){const sku=(m[2]||m[3]).toUpperCase().replace(/[-,]+$/,'');const q=+(m[1]||m[4]);const p=bySku(sku);if(p)pairs.push([p,q]);}
    if(pairs.length>1||(pairs.length===1&&/order|basket|add|build/.test(low))){
      pairs.forEach(([p,q])=>addToCart(p.sku,q,'c1')); refresh();
      const total=pairs.reduce((s,[p,q])=>s+p.price*q,0);
      say(`I built the order and added it to your Main basket.`);
      add(pairs.map(([p,q])=>`<div class="kai-row"><span>${q} × ${E(p.name)}</span><b>${fmt(p.price*q)}</b></div>`).join('')+`<div class="kai-row"><span><b style="color:#0F172A">Total at your prices</b></span><b>${fmt(total)}</b></div>`+(pairs.some(([p,q])=>Object.values(p.stock).reduce((a,b)=>a+b,0)<q)?`<div class="kai-row"><span>Note</span><b>Some lines exceed stock</b></div>`:'')+`<div class="kai-btns"><button class="kai-btn" type="button" data-kgo="cart">Review and checkout</button></div>`,'kai-card'); return;}
    // stock / price
    let ps=findSkus(t);
    if(!ps.length){const w=low.match(/boiler|radiator|pump|cylinder|vessel|thermostat|valve|manifold/); if(w) ps=PRODUCTS.filter(p=>p.name.toLowerCase().includes(w[0])).slice(0,3);}
    if(ps.length){const wh=Object.entries(WH).find(([k,n])=>low.includes(n.toLowerCase()));
      ps.slice(0,3).forEach((p,i)=>{ if(i===0&&wh) say(p.stock[wh[0]]>0?`Yes — ${p.stock[wh[0]]} pcs of ${p.sku} in ${wh[1]}.`:`${p.sku} is out of stock in ${wh[1]} right now.`); add(prodCard(p),'kai-card'); }); return;}
    say("I can help with stock and prices, building an order from a list, repeating a past order and tracking deliveries. Try one of these:"); chips();
  }
  function send(t){ t=t.trim(); if(!t) return; add(E(t),'kai-m me'); inp.value=''; const w=add('<span class="kai-dots"><i></i><i></i><i></i></span>'); setTimeout(()=>{w.remove(); try{answer(t);}catch(e){say('Sorry, something went wrong. Try again.');}},650); }
  document.getElementById('kaiF').addEventListener('submit',e=>{e.preventDefault();send(inp.value);});
  window.kaiSend=send;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp.value);} });
  body.addEventListener('click',e=>{
    const c=e.target.closest('.kai-chip'); if(c){send(c.querySelector('span').textContent);return;}
    const a=e.target.closest('[data-kadd]'); if(a){const [s,q]=a.dataset.kadd.split(':'); addToCart(s,+q,'c1'); refresh(); say(`Added 1 × ${s} to your Main basket.`); return;}
    const g=e.target.closest('[data-kgo]'); if(g){ go(g.dataset.kgo); if(innerWidth<720) close(); }
  });
  const fab=document.getElementById('kaiFab');
  const _render=render; render=function(){ _render(); fab.style.display = S.mode==='mgr' ? 'none' : ''; if(S.mode==='mgr') close(); };
})();

if(location.hash.startsWith('#/')) S.path=location.hash.slice(2);
