  <a class="btn" id="dCta" href="index.html#contact">I want this</a>
</div>

<script>{
  const D = {
    clarix: ['Clarix — CRM and client portal', 'saas.html'],
    portal: ['Kalderra — dealer portal', 'index.html'],
    'portal-m': ['Kalderra — manufacturer side', 'index.html'],
    dental: ['Dental clinic — Lotus Arc design', 'sites.html'],
    counsellor: ['Therapist or coach — Claire Whitmore design', 'sites.html'],
    homes: ['Construction company — Fernleigh Homes design', 'sites.html'],
    tours: ['Tours and travel — Wayfolk design', 'sites.html'],
    store: ['Online store — Tidewell design', 'sites.html']
  };
  const k = D[location.hash.slice(1)] ? location.hash.slice(1) : 'clarix', [title, back] = D[k];
  document.getElementById('dTitle').textContent = title;
  document.getElementById('dBack').href = back;
  document.getElementById('dCta').href = back + '#contact';
  document.getElementById('dFrame').src = k === 'portal-m' ? 'demos/portal/index.html#/m' : 'demos/' + k + '/index.html';
  document.title = 'Paneform — ' + title;
  addEventListener('hashchange', () => location.reload());
}</script>
